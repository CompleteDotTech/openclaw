          ${{ runner.temp }}/p06-voice-proof/test-types.log
          ${{ runner.temp }}/p06-voice-proof/tests.log
          ${{ runner.temp }}/p06-voice-proof/types.log
          ${{ runner.temp }}/p06-voice-proof/browser-result.json
          ${{ runner.temp }}/p06-voice-proof/ui-proof/**/*.png
          ${{ runner.temp }}/p06-voice-proof/ui-proof/**/*.json
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
