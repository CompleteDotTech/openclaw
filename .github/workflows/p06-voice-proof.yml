# Evidence-only full exact source proof with actual, separately built pinned-parent assets.
name: P06 stage4 full exact source and actual rollback proof
'on':
  push:
    branches:
    - evidence/p06-voice-routes-20261126
permissions:
  contents: read
concurrency:
  group: p06-stage4-${{ github.workflow_sha }}
  cancel-in-progress: false
defaults:
  run:
    shell: bash --noprofile --norc -e -o pipefail {0}
jobs:
  parent-assets:
    name: Build immutable provisional parent assets
    if: github.repository == 'CompleteDotTech/openclaw'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      CI: 'true'
      SOURCE_REPOSITORY: Marvinthebored/openclaw
      SOURCE_SHA: 92182120e8baa7ce001f41dec7f0bba1489e6636
      EXPECTED_SOURCE_TREE: d552dd794421d98780343e789ddc55249cf24646
      WORKFLOW_SHA: ${{ github.workflow_sha }}
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: 'true'
      PNPM_CONFIG_FROZEN_LOCKFILE: 'true'
      GOGC: '30'
      GOMEMLIMIT: 3GiB
    steps:
    - name: Initialize narrow parent build output
      run: |
        printf 'P06_PROOF_DIR=%s/p06-rollback-parent\n' "$RUNNER_TEMP" >> "$GITHUB_ENV"
        printf 'P06_ASSET_TARGET=%s/p06-rollback-parent/assets\n' "$RUNNER_TEMP" >> "$GITHUB_ENV"
        printf 'P06_ASSET_RECEIPT=%s/p06-rollback-parent/build-receipt.json\n' "$RUNNER_TEMP" >> "$GITHUB_ENV"
    - name: Checkout the exact provisional parent product
      id: checkout
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      with:
        repository: ${{ env.SOURCE_REPOSITORY }}
        ref: ${{ env.SOURCE_SHA }}
        fetch-depth: '1'
        persist-credentials: 'false'
    - name: Verify actual parent source identity
      id: identity
      run: |
        mkdir -p "$P06_PROOF_DIR"
        test "$(git rev-parse HEAD)" = "$SOURCE_SHA"
        test "$(git rev-parse 'HEAD^{tree}')" = "$EXPECTED_SOURCE_TREE"
        git diff --exit-code
        git diff --cached --exit-code
        python3 - <<'PY'
        import json
        import os
        from pathlib import Path
        receipt = {key.lower(): os.environ[key] for key in ("SOURCE_REPOSITORY", "SOURCE_SHA", "WORKFLOW_SHA")}
        receipt["source_tree"] = os.environ["EXPECTED_SOURCE_TREE"]
        receipt["proof_kind"] = "provisional-parent-production-assets"
        receipt["run_id"] = os.environ["GITHUB_RUN_ID"]
        Path(os.environ["P06_PROOF_DIR"], "source.json").write_text(json.dumps(receipt, indent=2) + "\n")
        print(json.dumps(receipt, indent=2))
        PY
    - name: Prepare canonical Node and pnpm without shared caches
      id: toolchain
      uses: ./.github/actions/setup-node-env
      with:
        node-version: 24.22.1
        install-bun: 'false'
        install-deps: 'false'
        semantic-checks: 'true'
        cache-mode: 'off'
    - name: Install this checkout's frozen dependencies
      id: install
      run: |
        {
          node --version
          pnpm --version
          pnpm install --frozen-lockfile
        } 2>&1 | tee "$P06_PROOF_DIR/install.log"
        git diff --exit-code
        git diff --cached --exit-code
    - name: Build the actual pinned parent Control UI
      id: build
      if: ${{ !cancelled() && steps.install.outcome == 'success' }}
      run: |
        pnpm ui:build 2>&1 | tee "$P06_PROOF_DIR/build.log"
    - name: Retain pristine parent assets and their complete manifest
      id: assets
      if: ${{ !cancelled() && steps.build.outcome == 'success' }}
      run: |
        python3 - <<'PY'
        import hashlib
        import json
        import os
        from pathlib import Path
        import re
        import shutil

        source = Path("dist/control-ui")
        assert source.is_dir()
        html = (source / "index.html").read_text()
        match = re.search(r"globalThis\.OPENCLAW_CONTROL_UI_BUILD_INFO=(\{.*?\});</script>", html, flags=re.S)
        assert match, "Built document has no readable identity."
        build = json.loads(match.group(1))
        assert build["commit"] == os.environ["SOURCE_SHA"], build
        assert build["dirty"] is False, build
        assert isinstance(build["buildId"], str) and build["buildId"], build
        target = Path(os.environ["P06_ASSET_TARGET"])
        assert not target.exists(), target
        shutil.copytree(source, target)
        assets = {}
        for path in sorted(target.rglob("*")):
            assert not path.is_symlink(), path
            if path.is_file():
                data = path.read_bytes()
                assets[path.relative_to(target).as_posix()] = {"sha256": hashlib.sha256(data).hexdigest(), "bytes": len(data)}
        receipt = {
            "source_repository": os.environ["SOURCE_REPOSITORY"],
            "source_sha": os.environ["SOURCE_SHA"],
            "source_tree": os.environ["EXPECTED_SOURCE_TREE"],
            "workflow_sha": os.environ["WORKFLOW_SHA"],
            "run_id": os.environ["GITHUB_RUN_ID"],
            "build_command": "pnpm ui:build",
            "build_info": build,
            "index_sha256": assets["index.html"]["sha256"],
            "asset_count": len(assets),
            "asset_bytes": sum(item["bytes"] for item in assets.values()),
            "assets": assets,
        }
        Path(os.environ["P06_ASSET_RECEIPT"]).write_text(json.dumps(receipt, indent=2) + "\n")
        print(json.dumps({key: value for key, value in receipt.items() if key != "assets"}, indent=2))
        PY
    - name: Confirm tracked source remained unchanged
      id: source-unchanged
      if: ${{ !cancelled() && steps.identity.outcome == 'success' }}
      run: |
        {
          test "$(git rev-parse HEAD)" = "$SOURCE_SHA"
          test "$(git rev-parse 'HEAD^{tree}')" = "$EXPECTED_SOURCE_TREE"
          git diff --exit-code
          git diff --cached --exit-code
        } 2>&1 | tee "$P06_PROOF_DIR/source-unchanged.log"
    - name: Retain only the actual parent build and public-source receipts
      if: always()
      uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
      with:
        name: p06-rollback-parent-assets-${{ github.run_id }}-${{ github.run_attempt }}
        retention-days: '7'
        if-no-files-found: error
        include-hidden-files: 'true'
        path: |
          ${{ runner.temp }}/p06-rollback-parent/source.json
          ${{ runner.temp }}/p06-rollback-parent/build-receipt.json
          ${{ runner.temp }}/p06-rollback-parent/install.log
          ${{ runner.temp }}/p06-rollback-parent/build.log
          ${{ runner.temp }}/p06-rollback-parent/source-unchanged.log
          ${{ runner.temp }}/p06-rollback-parent/assets/**
  execution:
    if: ${{ !cancelled() && github.repository == 'CompleteDotTech/openclaw' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      CI: 'true'
      SOURCE_REPOSITORY: CompleteDotTech/openclaw
      SOURCE_SHA: ${{ matrix.source_sha }}
      PROOF_KIND: exact-committed-stage-proof
      WORKFLOW_SHA: ${{ github.workflow_sha }}
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: 'true'
      OPENCLAW_VITEST_RUNTIME: node
      OPENCLAW_VITEST_MAX_WORKERS: '1'
      OPENCLAW_TEST_PROJECTS_PARALLEL: '1'
      OPENCLAW_TYPECHECKER: tsgo
      OPENCLAW_LINT_TOOL: oxlint
      OPENCLAW_FORMAT_TOOL: oxfmt
      PNPM_CONFIG_FROZEN_LOCKFILE: 'true'
      P06_TEST_FILES: ${{ matrix.test_files }}
      P06_SOURCE_FILES: ${{ matrix.source_files }}
      EXPECTED_SOURCE_TREE: ${{ matrix.source_tree }}
      BASE_SHA: ${{ matrix.base_sha }}
      EXPECTED_BASE_TREE: ${{ matrix.base_tree }}
      SELECTION_BASE_SHA: ${{ matrix.selection_base_sha }}
      EXPECTED_SELECTION_BASE_TREE: ${{ matrix.selection_base_tree }}
      PROOF_LABEL: ${{ matrix.label }}
      P06_FORMAT_FILES: ${{ matrix.format_files }}
      P06_BROWSER_FILES: ${{ matrix.browser_files }}
      GOGC: '30'
      GOMEMLIMIT: 3GiB
      P06_ROLLBACK_TEST_FILE: ${{ matrix.rollback_file }}
      PROOF_LANE: execution
    steps:
    - name: Initialize proof directory and require immutable identities
      run: |
        printf 'P06_PROOF_DIR=%s/p06-voice-proof\n' "$RUNNER_TEMP" >> "$GITHUB_ENV"
        for value in "$SOURCE_SHA" "$EXPECTED_SOURCE_TREE" "$BASE_SHA" "$EXPECTED_BASE_TREE" "$SELECTION_BASE_SHA" "$EXPECTED_SELECTION_BASE_TREE"; do
          [[ "$value" =~ ^[0-9a-f]{40}$ ]]
        done
    - name: Checkout the exact committed stage
      id: checkout
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      with:
        repository: ${{ env.SOURCE_REPOSITORY }}
        ref: ${{ env.SOURCE_SHA }}
        fetch-depth: '1'
        persist-credentials: 'false'
    - name: Verify source, review base, and proof selection identities
      id: identity
      run: |
        mkdir -p "$P06_PROOF_DIR"
        test "$(git rev-parse HEAD)" = "$SOURCE_SHA"
        test "$(git rev-parse 'HEAD^{tree}')" = "$EXPECTED_SOURCE_TREE"
        for ref in "$BASE_SHA" "$SELECTION_BASE_SHA"; do
          git -c core.hooksPath=/dev/null fetch --no-tags --depth=1 origin "$ref"
        done
        test "$(git rev-parse "$BASE_SHA^{tree}")" = "$EXPECTED_BASE_TREE"
        test "$(git rev-parse "$SELECTION_BASE_SHA^{tree}")" = "$EXPECTED_SELECTION_BASE_TREE"
        git diff --exit-code
        git diff --cached --exit-code
        python3 - <<'PY'
        import hashlib
        import json
        import os
        from pathlib import Path
        import subprocess

        proof = Path(os.environ["P06_PROOF_DIR"])
        selected = {}
        for label, variable in (("format", "P06_FORMAT_FILES"), ("source", "P06_SOURCE_FILES"), ("test", "P06_TEST_FILES"), ("browser", "P06_BROWSER_FILES")):
            files = os.environ[variable].splitlines()
            assert label == "browser" or files, f"Missing selection: {label}"
            assert all(files) and len(files) == len(set(files))
            for name in files:
                path = Path(name)
                assert not path.is_absolute() and ".." not in path.parts and path.is_file(), name
                subprocess.check_call(["git", "ls-files", "--error-unmatch", "--", name], stdout=subprocess.DEVNULL)
            (proof / f"{label}-files.txt").write_text("\n".join(files) + ("\n" if files else ""))
            selected[label] = files
        changed = subprocess.check_output(["git", "diff", "--name-only", "--no-renames", "--diff-filter=ACMRT", os.environ["SELECTION_BASE_SHA"], "HEAD"], text=True).splitlines()
        assert sorted(selected["format"]) == sorted(changed), "Format selection differs from the pinned source delta."
        receipt = {
            "label": os.environ["PROOF_LABEL"],
            "proof_kind": os.environ["PROOF_KIND"],
            "proof_lane": os.environ["PROOF_LANE"],
            "source_repository": os.environ["SOURCE_REPOSITORY"],
            "source_sha": os.environ["SOURCE_SHA"],
            "source_tree": os.environ["EXPECTED_SOURCE_TREE"],
            "review_base_sha": os.environ["BASE_SHA"],
            "review_base_tree": os.environ["EXPECTED_BASE_TREE"],
            "selection_base_sha": os.environ["SELECTION_BASE_SHA"],
            "selection_base_tree": os.environ["EXPECTED_SELECTION_BASE_TREE"],
            "workflow_repository": os.environ["GITHUB_REPOSITORY"],
            "workflow_ref": os.environ["GITHUB_WORKFLOW_REF"],
            "workflow_sha": os.environ["WORKFLOW_SHA"],
            "run_url": f"{os.environ['GITHUB_SERVER_URL']}/{os.environ['GITHUB_REPOSITORY']}/actions/runs/{os.environ['GITHUB_RUN_ID']}",
            "run_attempt": os.environ["GITHUB_RUN_ATTEMPT"],
            "selection": selected,
            "rollback_test_file": os.environ["P06_ROLLBACK_TEST_FILE"],
            "selected_source_sha256": {name: hashlib.sha256(Path(name).read_bytes()).hexdigest() for name in sorted(set(sum(selected.values(), [])))},
            "limitations": [
                "Synthetic Gateway, media, and provider fixtures only; no live credentials or microphone hardware.",
                "Native/global, stable upgrade, and post-parent-merge qualification are NOT RUN.",
                "Ratchets compare this exact stage to its actual review base, without synthesizing a PR merge checkout.",
            ],
        }
        (proof / "source.json").write_text(json.dumps(receipt, indent=2) + "\n")
        print(json.dumps(receipt, indent=2))
        PY
        {
          uname -a
          getconf _NPROCESSORS_ONLN
          free -m
          df -h .
        } 2>&1 | tee "$P06_PROOF_DIR/resources.log"
    - name: Prepare canonical Node and pnpm without shared caches
      id: toolchain
      uses: ./.github/actions/setup-node-env
      with:
        node-version: 24.22.1
        install-bun: 'false'
        install-deps: 'false'
        semantic-checks: 'true'
        cache-mode: 'off'
    - name: Install this checkout's frozen dependencies
      id: install
      run: |
        {
          node --version
          pnpm --version
          pnpm install --frozen-lockfile
        } 2>&1 | tee "$P06_PROOF_DIR/install.log"
        git diff --exit-code
        git diff --cached --exit-code
    - name: Focused stage regressions and unchanged owner coverage
      id: tests
      if: ${{ !cancelled() && steps.install.outcome == 'success' }}
      run: |
        mapfile -t test_files < "$P06_PROOF_DIR/test-files.txt"
        pnpm test "${test_files[@]}" --maxWorkers=1 2>&1 | tee "$P06_PROOF_DIR/tests.log"
    - name: Retain early unit failure diagnostics
      if: ${{ !cancelled() && steps.tests.outcome == 'failure' }}
      uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
      with:
        name: p06-stage4-unit-failure-${{ github.run_id }}-${{ github.run_attempt }}
        retention-days: 7
        if-no-files-found: error
        path: |
          ${{ runner.temp }}/p06-voice-proof/source.json
          ${{ runner.temp }}/p06-voice-proof/tests.log
    - name: Production Control UI typecheck
      id: types
      if: ${{ !cancelled() && steps.install.outcome == 'success' }}
      run: |
        pnpm tsgo:ui 2>&1 | tee "$P06_PROOF_DIR/types.log"
    - name: Retain early production-types failure diagnostics
      if: ${{ !cancelled() && steps.types.outcome == 'failure' }}
      uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
      with:
        name: p06-stage4-production-types-failure-${{ github.run_id }}-${{ github.run_attempt }}
        retention-days: 7
        if-no-files-found: error
        path: |
          ${{ runner.temp }}/p06-voice-proof/source.json
          ${{ runner.temp }}/p06-voice-proof/types.log
    - name: Type-aware lint for selected production owners
      id: lint
      if: ${{ !cancelled() && steps.install.outcome == 'success' }}
      run: |
        mapfile -t source_files < "$P06_PROOF_DIR/source-files.txt"
        node scripts/run-oxlint.mjs --tsconfig tsconfig.ui.json "${source_files[@]}" 2>&1 | tee "$P06_PROOF_DIR/lint.log"
    - name: Canonical formatting and parity for the frozen changed files
      id: format
      if: ${{ !cancelled() && steps.install.outcome == 'success' }}
      run: |
        mapfile -t format_files < "$P06_PROOF_DIR/format-files.txt"
        pnpm format:check --no-error-on-unmatched-pattern -- "${format_files[@]}" 2>&1 | tee "$P06_PROOF_DIR/format.log"
    - name: Verify Control UI copy and catalog wiring
      id: i18n
      if: ${{ !cancelled() && steps.install.outcome == 'success' }}
      run: |
        pnpm ui:i18n:verify 2>&1 | tee "$P06_PROOF_DIR/i18n.log"
    - name: Build Control UI from this exact committed source
      id: build
      if: ${{ !cancelled() && steps.install.outcome == 'success' }}
      run: |
        pnpm ui:build 2>&1 | tee "$P06_PROOF_DIR/build.log"
    - name: Retrieve only this run's actual parent assets
      id: rollback-parent-assets
      if: ${{ !cancelled() && steps.build.outcome == 'success' && matrix.rollback == 'true' && needs.parent-assets.result == 'success' }}
      uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
      with:
        name: p06-rollback-parent-assets-${{ github.run_id }}-${{ github.run_attempt }}
        path: ${{ runner.temp }}/p06-rollback/parent
    - name: Verify transferred parent assets and freeze exact child assets
      id: rollback-assets
      if: ${{ !cancelled() && steps.rollback-parent-assets.outcome == 'success' }}
      run: |
        python3 - <<'PY'
        import hashlib
        import json
        import os
        from pathlib import Path

        parent = Path(os.environ["RUNNER_TEMP"], "p06-rollback", "parent")
        receipt = json.loads((parent / "build-receipt.json").read_text())
        assert receipt["source_sha"] == "92182120e8baa7ce001f41dec7f0bba1489e6636"
        assert receipt["source_tree"] == "d552dd794421d98780343e789ddc55249cf24646"
        assert receipt["workflow_sha"] == os.environ["WORKFLOW_SHA"]
        assert receipt["run_id"] == os.environ["GITHUB_RUN_ID"]
        assert receipt["build_info"]["commit"] == receipt["source_sha"]
        assert receipt["build_info"]["dirty"] is False
        assets = parent / "assets"
        actual = {}
        for path in sorted(assets.rglob("*")):
            assert not path.is_symlink(), path
            if path.is_file():
                data = path.read_bytes()
                actual[path.relative_to(assets).as_posix()] = {"sha256": hashlib.sha256(data).hexdigest(), "bytes": len(data)}
        assert actual and actual == receipt["assets"], "Transferred parent assets differ from the producer manifest."
        Path(os.environ["P06_PROOF_DIR"], "rollback-parent-build.json").write_text(json.dumps(receipt, indent=2) + "\n")
        print(f"Verified {len(actual)} exact-parent production assets.")
        PY
        export P06_ASSET_TARGET="$RUNNER_TEMP/p06-rollback/child-assets"
        export P06_ASSET_RECEIPT="$P06_PROOF_DIR/rollback-child-build.json"
        python3 - <<'PY'
        import hashlib
        import json
        import os
        from pathlib import Path
        import re
        import shutil

        source = Path("dist/control-ui")
        assert source.is_dir()
        html = (source / "index.html").read_text()
        match = re.search(r"globalThis\.OPENCLAW_CONTROL_UI_BUILD_INFO=(\{.*?\});</script>", html, flags=re.S)
        assert match, "Built document has no readable identity."
        build = json.loads(match.group(1))
        assert build["commit"] == os.environ["SOURCE_SHA"], build
        assert build["dirty"] is False, build
        assert isinstance(build["buildId"], str) and build["buildId"], build
        target = Path(os.environ["P06_ASSET_TARGET"])
        assert not target.exists(), target
        shutil.copytree(source, target)
        assets = {}
        for path in sorted(target.rglob("*")):
            assert not path.is_symlink(), path
            if path.is_file():
                data = path.read_bytes()
                assets[path.relative_to(target).as_posix()] = {"sha256": hashlib.sha256(data).hexdigest(), "bytes": len(data)}
        receipt = {
            "source_repository": os.environ["SOURCE_REPOSITORY"],
            "source_sha": os.environ["SOURCE_SHA"],
            "source_tree": os.environ["EXPECTED_SOURCE_TREE"],
            "workflow_sha": os.environ["WORKFLOW_SHA"],
            "run_id": os.environ["GITHUB_RUN_ID"],
            "build_command": "pnpm ui:build",
            "build_info": build,
            "index_sha256": assets["index.html"]["sha256"],
            "asset_count": len(assets),
            "asset_bytes": sum(item["bytes"] for item in assets.values()),
            "assets": assets,
        }
        Path(os.environ["P06_ASSET_RECEIPT"]).write_text(json.dumps(receipt, indent=2) + "\n")
        print(json.dumps({key: value for key, value in receipt.items() if key != "assets"}, indent=2))
        PY
        python3 - <<'PY'
        import json
        import os
        from pathlib import Path

        proof = Path(os.environ["P06_PROOF_DIR"])
        parent = json.loads((proof / "rollback-parent-build.json").read_text())
        child = json.loads((proof / "rollback-child-build.json").read_text())
        assert child["source_sha"] == os.environ["SOURCE_SHA"]
        assert child["source_tree"] == os.environ["EXPECTED_SOURCE_TREE"]
        assert parent["build_info"]["buildId"] != child["build_info"]["buildId"]
        assert parent["index_sha256"] != child["index_sha256"]
        inputs = {"parent": {key: value for key, value in parent.items() if key != "assets"}, "child": {key: value for key, value in child.items() if key != "assets"}, "qualification": "Both production asset directories are exact-source builds; the browser test must copy them before swapping and must preserve their original embedded identities."}
        (proof / "rollback-inputs.json").write_text(json.dumps(inputs, indent=2) + "\n")
        print(json.dumps(inputs, indent=2))
        PY
        printf 'P06_ROLLBACK_PARENT_ASSETS=%s/p06-rollback/parent/assets\n' "$RUNNER_TEMP" >> "$GITHUB_ENV"
        printf 'P06_ROLLBACK_CHILD_ASSETS=%s/p06-rollback/child-assets\n' "$RUNNER_TEMP" >> "$GITHUB_ENV"
        printf 'P06_ROLLBACK_CHILD_SHA=%s\n' "$SOURCE_SHA" >> "$GITHUB_ENV"
    - name: Exercise selected voice fixtures in real Chromium
      id: browser
      if: ${{ !cancelled() && steps.install.outcome == 'success' && matrix.browser_files != '' }}
      env:
        OPENCLAW_CAPTURE_UI_PROOF: '1'
        OPENCLAW_UI_E2E_SKIP_REAL_GATEWAY: '1'
      run: |
        export OPENCLAW_UI_E2E_ARTIFACT_DIR="$P06_PROOF_DIR/ui-proof"
        mapfile -t browser_files < "$P06_PROOF_DIR/browser-files.txt"
        pnpm test:ui:e2e "${browser_files[@]}" --maxWorkers=1 --reporter=default --reporter=json --outputFile.json "$P06_PROOF_DIR/browser-result.json" 2>&1 | tee "$P06_PROOF_DIR/browser.log"
        python3 - <<'PY'
        import json
        import os
        from pathlib import Path

        proof = Path(os.environ["P06_PROOF_DIR"])
        report = json.loads((proof / "browser-result.json").read_text())
        expected = {'ui/src/e2e/browser-dictation-status.e2e.test.ts': 17, 'ui/src/e2e/browser-talk-start-stop.e2e.test.ts': 11, 'ui/src/e2e/browser-talk-webkit-error.e2e.test.ts': 3, 'ui/src/e2e/browser-talk-voice-selection.e2e.test.ts': 3, 'ui/src/e2e/browser-talk-ordering.e2e.test.ts': 2, 'ui/src/e2e/browser-talk-microphone-lifetime.e2e.test.ts': 2, 'ui/src/e2e/browser-talk-start-stop.webrtc-sdp.e2e.test.ts': 2, 'ui/src/e2e/browser-voice-routes.e2e.test.ts': 11}
        assert report["success"] is True and report["numTotalTests"] == 51 and report["numPassedTests"] == 51
        for key in ("numFailedTestSuites", "numPendingTestSuites", "numFailedTests", "numPendingTests", "numTodoTests"):
            assert report[key] == 0, key
        assert len(report["testResults"]) == len(expected)
        observed = {}
        for result in report["testResults"]:
            name = Path(result["name"]).relative_to(Path.cwd()).as_posix()
            assert name in expected and result["status"] == "passed"
            assert len(result["assertionResults"]) == expected[name]
            assert all(test["status"] == "passed" for test in result["assertionResults"])
            observed[name] = len(result["assertionResults"])
        assert observed == expected
        print("Verified all 51 browser assertions across the 8 selected files passed with zero skipped/pending/todo/failed cases.")
        PY
    - name: Exercise actual parent to child to parent compatibility
      id: rollback
      if: ${{ !cancelled() && steps.rollback-assets.outcome == 'success' && matrix.rollback == 'true' }}
      env:
        P06_ROLLBACK_TEST_FILE: ${{ matrix.rollback_file }}
        OPENCLAW_CAPTURE_UI_PROOF: '1'
        OPENCLAW_UI_E2E_SKIP_REAL_GATEWAY: '1'
      run: |
        export OPENCLAW_UI_E2E_ARTIFACT_DIR="$P06_PROOF_DIR/ui-proof"
        test -n "$P06_ROLLBACK_TEST_FILE"
        git ls-files --error-unmatch -- "$P06_ROLLBACK_TEST_FILE"
        pnpm test:ui:e2e "$P06_ROLLBACK_TEST_FILE" --maxWorkers=1 --reporter=default --reporter=json --outputFile.json "$P06_PROOF_DIR/rollback-result.json" 2>&1 | tee "$P06_PROOF_DIR/rollback.log"
        python3 - <<'PY'
        import json
        import os
        from pathlib import Path

        report = json.loads(Path(os.environ["P06_PROOF_DIR"], "rollback-result.json").read_text())
        assert report["success"] is True
        assert report["numTotalTests"] == 1 and report["numPassedTests"] == 1
        for key in ("numFailedTestSuites", "numPendingTestSuites", "numFailedTests", "numPendingTests", "numTodoTests"):
            assert report[key] == 0, key
        assert len(report["testResults"]) == 1
        result = report["testResults"][0]
        assert Path(result["name"]).resolve() == Path(os.environ["P06_ROLLBACK_TEST_FILE"]).resolve()
        assert result["status"] == "passed"
        assert len(result["assertionResults"]) == 1
        assertion = result["assertionResults"][0]
        assert assertion["status"] == "passed"
        assert assertion["title"] == "preserves real saved devices and drafts and returns idle after rolling back active dictation"
        print("Verified exact rollback suite: 1 executed, 1 passed, 0 skipped/pending/todo/failed.")
        PY
    - name: Confirm tracked source remained unchanged
      id: source-unchanged
      if: ${{ !cancelled() && steps.identity.outcome == 'success' }}
