# NARROW CANDIDATE: causal regression coverage before final stage qualification.
'on':
  push:
    branches:
    - evidence/p06-voice-routes-20261126
permissions:
  contents: read
defaults:
  run:
    shell: bash --noprofile --norc -e -o pipefail {0}
name: P06 narrow native-release repair validation
concurrency:
  group: p06-native-release-${{ github.workflow_sha }}
  cancel-in-progress: false
jobs:
  candidate:
    if: github.repository == 'CompleteDotTech/openclaw'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      CI: 'true'
      SOURCE_REPOSITORY: CompleteDotTech/openclaw
      SOURCE_SHA: ${{ matrix.source_sha }}
      PROOF_KIND: narrow-native-release-candidate-validation
      WORKFLOW_SHA: ${{ github.workflow_sha }}
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: 'true'
      OPENCLAW_VITEST_RUNTIME: node
      OPENCLAW_VITEST_MAX_WORKERS: '1'
      OPENCLAW_TEST_PROJECTS_PARALLEL: '1'
      OPENCLAW_TYPECHECKER: tsgo
      OPENCLAW_LINT_TOOL: oxlint
      OPENCLAW_FORMAT_TOOL: oxfmt
      PNPM_CONFIG_FROZEN_LOCKFILE: 'true'
      P06_TEST_FILES: ${{ matrix.test_files }}
      P06_SOURCE_FILES: ${{ matrix.source_files }}
      EXPECTED_SOURCE_TREE: ${{ matrix.source_tree }}
      BASE_SHA: ${{ matrix.base_sha }}
      EXPECTED_BASE_TREE: ${{ matrix.base_tree }}
      SELECTION_BASE_SHA: ${{ matrix.selection_base_sha }}
      EXPECTED_SELECTION_BASE_TREE: ${{ matrix.selection_base_tree }}
      PROOF_LABEL: ${{ matrix.label }}
      P06_FORMAT_FILES: ${{ matrix.format_files }}
      P06_BROWSER_FILES: ${{ matrix.browser_files }}
      GOGC: '30'
      GOMEMLIMIT: 3GiB
      PROOF_LANE: causal-unit-types-lint-format-browser
    steps:
    - name: Initialize proof directory and require immutable identities
      run: |
        printf 'P06_PROOF_DIR=%s/p06-voice-proof\n' "$RUNNER_TEMP" >> "$GITHUB_ENV"
        for value in "$SOURCE_SHA" "$EXPECTED_SOURCE_TREE" "$BASE_SHA" "$EXPECTED_BASE_TREE" "$SELECTION_BASE_SHA" "$EXPECTED_SELECTION_BASE_TREE"; do
          [[ "$value" =~ ^[0-9a-f]{40}$ ]]
        done
    - name: Checkout the exact committed stage
      id: checkout
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      with:
        repository: ${{ env.SOURCE_REPOSITORY }}
        ref: ${{ env.SOURCE_SHA }}
        fetch-depth: '1'
        persist-credentials: 'false'
    - name: Verify source, review base, and proof selection identities
      id: identity
      run: |
        mkdir -p "$P06_PROOF_DIR"
        test "$(git rev-parse HEAD)" = "$SOURCE_SHA"
        test "$(git rev-parse 'HEAD^{tree}')" = "$EXPECTED_SOURCE_TREE"
        for ref in "$BASE_SHA" "$SELECTION_BASE_SHA"; do
          git -c core.hooksPath=/dev/null fetch --no-tags --depth=1 origin "$ref"
        done
        test "$(git rev-parse "$BASE_SHA^{tree}")" = "$EXPECTED_BASE_TREE"
        test "$(git rev-parse "$SELECTION_BASE_SHA^{tree}")" = "$EXPECTED_SELECTION_BASE_TREE"
        git diff --exit-code
        git diff --cached --exit-code
        python3 - <<'PY'
        import hashlib
        import json
        import os
        from pathlib import Path
        import subprocess

        proof = Path(os.environ["P06_PROOF_DIR"])
        selected = {}
        for label, variable in (("format", "P06_FORMAT_FILES"), ("source", "P06_SOURCE_FILES"), ("test", "P06_TEST_FILES"), ("browser", "P06_BROWSER_FILES")):
            files = os.environ[variable].splitlines()
            assert label == "browser" or files, f"Missing selection: {label}"
            assert all(files) and len(files) == len(set(files))
            for name in files:
                path = Path(name)
                assert not path.is_absolute() and ".." not in path.parts and path.is_file(), name
                subprocess.check_call(["git", "ls-files", "--error-unmatch", "--", name], stdout=subprocess.DEVNULL)
            (proof / f"{label}-files.txt").write_text("\n".join(files) + ("\n" if files else ""))
            selected[label] = files
        changed = subprocess.check_output(["git", "diff", "--name-only", "--no-renames", "--diff-filter=ACMRT", os.environ["SELECTION_BASE_SHA"], "HEAD"], text=True).splitlines()
        assert sorted(selected["format"]) == sorted(changed), "Format selection differs from the pinned source delta."
        receipt = {
            "label": os.environ["PROOF_LABEL"],
            "proof_kind": os.environ["PROOF_KIND"],
            "source_repository": os.environ["SOURCE_REPOSITORY"],
            "source_sha": os.environ["SOURCE_SHA"],
            "source_tree": os.environ["EXPECTED_SOURCE_TREE"],
            "causal_scope_base_sha": os.environ["BASE_SHA"],
            "causal_scope_base_tree": os.environ["EXPECTED_BASE_TREE"],
            "selection_base_sha": os.environ["SELECTION_BASE_SHA"],
            "selection_base_tree": os.environ["EXPECTED_SELECTION_BASE_TREE"],
            "workflow_repository": os.environ["GITHUB_REPOSITORY"],
            "workflow_ref": os.environ["GITHUB_WORKFLOW_REF"],
            "workflow_sha": os.environ["WORKFLOW_SHA"],
            "run_url": f"{os.environ['GITHUB_SERVER_URL']}/{os.environ['GITHUB_REPOSITORY']}/actions/runs/{os.environ['GITHUB_RUN_ID']}",
            "run_attempt": os.environ["GITHUB_RUN_ATTEMPT"],
            "selection": selected,
            "selected_source_sha256": {name: hashlib.sha256(Path(name).read_bytes()).hexdigest() for name in sorted(set(sum(selected.values(), [])))},
            "limitations": [
                "Synthetic Gateway, media, and provider fixtures only; no live credentials or microphone hardware.",
                "Native/global, stable upgrade, and post-parent-merge qualification are NOT RUN.",
                "Comparison base scopes exactly the three repair files. This is narrow causal validation; no fixture-type/full-guard/rollback qualification.",
            ],
        }
        (proof / "source.json").write_text(json.dumps(receipt, indent=2) + "\n")
        print(json.dumps(receipt, indent=2))
        PY
        {
          uname -a
          getconf _NPROCESSORS_ONLN
          free -m
          df -h .
        } 2>&1 | tee "$P06_PROOF_DIR/resources.log"
    - name: Prepare canonical Node and pnpm without shared caches
      id: toolchain
      uses: ./.github/actions/setup-node-env
      with:
        node-version: 24.22.1
        install-bun: 'false'
        install-deps: 'false'
        semantic-checks: 'true'
        cache-mode: 'off'
    - name: Install this checkout's frozen dependencies
      id: install
      run: |
        {
          node --version
          pnpm --version
          pnpm install --frozen-lockfile
        } 2>&1 | tee "$P06_PROOF_DIR/install.log"
        git diff --exit-code
        git diff --cached --exit-code
    - name: Focused stage regressions and unchanged owner coverage
      id: tests
      if: ${{ !cancelled() && steps.install.outcome == 'success' }}
      run: |
        mapfile -t test_files < "$P06_PROOF_DIR/test-files.txt"
        pnpm test "${test_files[@]}" --maxWorkers=1 2>&1 | tee "$P06_PROOF_DIR/tests.log"
    - name: Retain early native-release unit failure
      if: ${{ !cancelled() && steps.tests.outcome == 'failure' }}
      uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
      with:
        name: p06-native-release-unit-failure-${{ github.run_id }}-${{ github.run_attempt }}
        retention-days: 7
        if-no-files-found: error
        path: |
          ${{ runner.temp }}/p06-voice-proof/source.json
          ${{ runner.temp }}/p06-voice-proof/tests.log
    - name: Production Control UI typecheck
      id: types
      if: ${{ !cancelled() && steps.install.outcome == 'success' }}
      run: |
        pnpm tsgo:ui 2>&1 | tee "$P06_PROOF_DIR/types.log"
    - name: Retain early native-release production-types failure
      if: ${{ !cancelled() && steps.types.outcome == 'failure' }}
      uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
      with:
        name: p06-native-release-production-types-failure-${{ github.run_id }}-${{ github.run_attempt }}
        retention-days: 7
        if-no-files-found: error
        path: |
          ${{ runner.temp }}/p06-voice-proof/source.json
          ${{ runner.temp }}/p06-voice-proof/types.log
    - name: Type-aware lint for selected production owners
      id: lint
      if: ${{ !cancelled() && steps.install.outcome == 'success' }}
      run: |
        mapfile -t source_files < "$P06_PROOF_DIR/source-files.txt"
        node scripts/run-oxlint.mjs --tsconfig tsconfig.ui.json "${source_files[@]}" 2>&1 | tee "$P06_PROOF_DIR/lint.log"
    - name: Canonical formatting and parity for the frozen changed files
      id: format
      if: ${{ !cancelled() && steps.install.outcome == 'success' }}
      run: |
        mapfile -t format_files < "$P06_PROOF_DIR/format-files.txt"
        pnpm format:check --no-error-on-unmatched-pattern -- "${format_files[@]}" 2>&1 | tee "$P06_PROOF_DIR/format.log"
    - name: Verify actual voice replacement and all nine explicit route cases
      id: browser
      if: ${{ !cancelled() && steps.install.outcome == 'success' && matrix.browser_files != '' }}
      env:
        OPENCLAW_CAPTURE_UI_PROOF: '1'
        OPENCLAW_UI_E2E_SKIP_REAL_GATEWAY: '1'
      run: |
        export OPENCLAW_UI_E2E_ARTIFACT_DIR="$P06_PROOF_DIR/ui-proof"
        mapfile -t browser_files < "$P06_PROOF_DIR/browser-files.txt"
        pnpm test:ui:e2e "${browser_files[@]}" --testNamePattern "keeps the composer free of voice settings|Control UI explicit voice routes" --maxWorkers=1 --reporter=default --reporter=json --outputFile.json "$P06_PROOF_DIR/browser-result.json" 2>&1 | tee "$P06_PROOF_DIR/browser.log"
        python3 - <<'PY'
        import json,os
        from pathlib import Path
        proof=Path(os.environ["P06_PROOF_DIR"])
        report=json.loads((proof/"browser-result.json").read_text())
        assert report["success"] is True
        assert report["numPassedTests"]==10 and report["numTotalTests"]==12
        assert report["numFailedTests"]==0 and report["numPendingTests"]==2 and report["numTodoTests"]==0
        observed={}
        for result in report["testResults"]:
            name=Path(result["name"]).relative_to(Path.cwd()).as_posix()
            tests=result["assertionResults"]
            observed[name]={"passed":sum(t["status"]=="passed" for t in tests),"filtered":sum(t["status"] in {"pending","skipped"} for t in tests)}
            assert all(t["status"] in {"passed","pending","skipped"} for t in tests)
        assert observed=={
            "ui/src/e2e/browser-talk-voice-selection.e2e.test.ts":{"passed":1,"filtered":2},
            "ui/src/e2e/browser-voice-routes.e2e.test.ts":{"passed":9,"filtered":0},
        },observed
        print("Verified voice replacement plus all nine explicit route cases: 10 executed/passed, two unrelated settings cases filtered, zero failed/todo.")
        PY
    - name: Confirm tracked source remained unchanged
      id: source-unchanged
      if: ${{ !cancelled() && steps.identity.outcome == 'success' }}
      run: |
        {
          test "$(git rev-parse HEAD)" = "$SOURCE_SHA"
          test "$(git rev-parse 'HEAD^{tree}')" = "$EXPECTED_SOURCE_TREE"
          git diff --exit-code
          git diff --cached --exit-code
        } 2>&1 | tee "$P06_PROOF_DIR/source-unchanged.log"
    - name: Record every observed lane and unrun qualification
      if: always()
      env:
        CHECKOUT_RESULT: ${{ steps.checkout.outcome }}
        IDENTITY_RESULT: ${{ steps.identity.outcome }}
        TOOLCHAIN_RESULT: ${{ steps.toolchain.outcome }}
        INSTALL_RESULT: ${{ steps.install.outcome }}
        TESTS_RESULT: ${{ steps.tests.outcome }}
        TYPES_RESULT: ${{ steps.types.outcome }}
        LINT_RESULT: ${{ steps.lint.outcome }}
        FORMAT_RESULT: ${{ steps.format.outcome }}
        BROWSER_RESULT: ${{ steps.browser.outcome }}
        SOURCE_UNCHANGED_RESULT: ${{ steps.source-unchanged.outcome }}
      run: |
        mkdir -p "$P06_PROOF_DIR"
        python3 - <<'PY'
        import json
        import os
        from pathlib import Path

        proof = Path(os.environ["P06_PROOF_DIR"])
        labels = {"success": "PASS", "failure": "FAIL", "skipped": "NOT RUN", "cancelled": "CANCELLED", "": "NOT RUN"}
        outcomes = {name.lower().removesuffix("_result"): labels[os.environ.get(name, "")] for name in ('CHECKOUT_RESULT', 'IDENTITY_RESULT', 'TOOLCHAIN_RESULT', 'INSTALL_RESULT', 'TESTS_RESULT', 'TYPES_RESULT', 'LINT_RESULT', 'FORMAT_RESULT', 'BROWSER_RESULT', 'SOURCE_UNCHANGED_RESULT')}
        for name in ("fixture_types", "baseline_ratchets", "architecture", "full_browser_matrix", "rollback", "live_microphone", "live_provider", "native_global", "stable_upgrade", "post_parent_merge"):
            outcomes[name] = "NOT RUN"
        receipt = {
            "label": os.environ["PROOF_LABEL"],
            "proof_kind": os.environ["PROOF_KIND"],
            "qualification": "Narrow immutable candidate validation only; final review-stage and composite qualification remain separate.",
            "source_sha": os.environ["SOURCE_SHA"],
            "source_tree": os.environ["EXPECTED_SOURCE_TREE"],
            "review_base_sha": os.environ["BASE_SHA"],
            "workflow_sha": os.environ["WORKFLOW_SHA"],
            "outcomes": outcomes,
        }
        (proof / "outcomes.json").write_text(json.dumps(receipt, indent=2) + "\n")
        summary = [f"## P06 {os.environ['PROOF_LABEL']} committed-stage proof", "", f"Source `{os.environ['SOURCE_SHA']}`; review base `{os.environ['BASE_SHA']}`.", "", "| Lane | Observed result |", "| --- | --- |"]
        summary.extend(f"| {name} | {result} |" for name, result in outcomes.items())
        with open(os.environ["GITHUB_STEP_SUMMARY"], "a") as output:
            output.write("\n".join(summary) + "\n")
        print(json.dumps(receipt, indent=2))
        PY
    - name: Retain only task logs and synthetic UI evidence
      if: always()
      uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
      with:
        name: p06-native-release-candidate-${{ github.run_id }}-${{ github.run_attempt }}
        retention-days: '7'
        if-no-files-found: error
        path: |
          ${{ runner.temp }}/p06-voice-proof/source.json
          ${{ runner.temp }}/p06-voice-proof/outcomes.json
          ${{ runner.temp }}/p06-voice-proof/format-files.txt
          ${{ runner.temp }}/p06-voice-proof/source-files.txt
          ${{ runner.temp }}/p06-voice-proof/test-files.txt
          ${{ runner.temp }}/p06-voice-proof/browser-files.txt
          ${{ runner.temp }}/p06-voice-proof/resources.log
          ${{ runner.temp }}/p06-voice-proof/install.log
          ${{ runner.temp }}/p06-voice-proof/tests.log
          ${{ runner.temp }}/p06-voice-proof/types.log
          ${{ runner.temp }}/p06-voice-proof/lint.log
          ${{ runner.temp }}/p06-voice-proof/format.log
          ${{ runner.temp }}/p06-voice-proof/browser.log
          ${{ runner.temp }}/p06-voice-proof/browser-result.json
          ${{ runner.temp }}/p06-voice-proof/source-unchanged.log
          ${{ runner.temp }}/p06-voice-proof/ui-proof/**/*.png
          ${{ runner.temp }}/p06-voice-proof/ui-proof/**/*.json
    strategy:
      fail-fast: false
      matrix:
        include:
        - label: native-release-candidate
          source_sha: 1562ad43059fdd602368118751e0026946c1fea2
          source_tree: 3b3d8f1d33da903219a70ec6978cf1d0a42fb684
          base_sha: b53524def896ee3a47c8afe173c4ec40717629de
          base_tree: f6aa1d37afdd25c1bff8e232280729b87eb647f8
          selection_base_sha: b53524def896ee3a47c8afe173c4ec40717629de
          selection_base_tree: f6aa1d37afdd25c1bff8e232280729b87eb647f8
          format_files: |
            ui/src/lib/voice-route.ts
            ui/src/pages/chat/chat-realtime.ts
            ui/src/pages/chat/chat-realtime.test.ts
          source_files: |
            ui/src/lib/voice-route.ts
            ui/src/pages/chat/chat-realtime.ts
          test_files: |
            ui/src/lib/voice-route.test.ts
            ui/src/pages/chat/chat-realtime.test.ts
            ui/src/pages/chat/chat-realtime-handoff.test.ts
          browser_files: |
            ui/src/e2e/browser-talk-voice-selection.e2e.test.ts
            ui/src/e2e/browser-voice-routes.e2e.test.ts
    name: Validate causal native capture handoff repair
