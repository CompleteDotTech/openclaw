name: P06 short stage formatting

# Authorized immutable stage inputs and complete format selections. Each row has a fresh
# secretless runner; no test, typecheck, lint, or build runs in this workflow.
on:
  push:
    branches:
      - evidence/p06-voice-routes-20261126

permissions:
  contents: read

concurrency:
  group: p06-voice-routes-20261126
  cancel-in-progress: false

defaults:
  run:
    shell: bash --noprofile --norc -e -o pipefail {0}

jobs:
  generate-patch:
    if: github.repository == 'CompleteDotTech/openclaw'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        include:
          - label: stage1
            source_sha: f4f516758de23422d04fe692e3482d6d93633220
            source_tree: 8d2bd72d046d9246d94d60ed2d2b74aea72b98d4
            selection_base_sha: 92182120e8baa7ce001f41dec7f0bba1489e6636
            selection_base_tree: d552dd794421d98780343e789ddc55249cf24646
            format_files: |
              ui/src/pages/chat/chat-composer-actions.test.ts
              ui/src/pages/chat/chat-pane-retained-presentation.ts
              ui/src/pages/chat/chat-session-rail.test.ts
              ui/src/pages/chat/components/chat-composer-controls.tsx
              ui/src/pages/chat/components/chat-composer-dictation-options.ts
              ui/src/pages/chat/components/chat-composer-frame.ts
              ui/src/pages/chat/components/chat-session-rail-composer.tsx
              ui/src/pages/chat/components/direct-dictation-view.tsx
              ui/src/pages/chat/composer-dictation.test.ts
              ui/src/pages/chat/composer-dictation.ts
              ui/src/pages/chat/composer-direct-dictation.test.tsx
              ui/src/pages/chat/composer-direct-dictation.ts
              ui/src/pages/new-session/draft-persistence.ts
              ui/src/pages/new-session/new-session-page-owner.ts
          - label: combined
            source_sha: 35dd96ce4f7e2ff7d0ca387aa6fccf286e80d660
            source_tree: f3e678f7ecf74f1f684a77f53af85a9b16bcfcd6
            selection_base_sha: 92182120e8baa7ce001f41dec7f0bba1489e6636
            selection_base_tree: d552dd794421d98780343e789ddc55249cf24646
            format_files: |
              docs/web/control-ui/chat.md
              ui/src/e2e/browser-dictation-status.e2e.test.ts
              ui/src/e2e/browser-talk-microphone-lifetime.e2e.test.ts
              ui/src/e2e/browser-talk-ordering.e2e.test.ts
              ui/src/e2e/browser-talk-start-stop.e2e.test.ts
              ui/src/e2e/browser-talk-start-stop.webrtc-sdp.e2e.test.ts
              ui/src/e2e/browser-talk-voice-selection.e2e.test.ts
              ui/src/e2e/browser-talk-webkit-error.e2e.test.ts
              ui/src/e2e/browser-voice-routes.e2e.test.ts
              ui/src/i18n/locales/en-chat-composer.ts
              ui/src/lib/voice-route.test.ts
              ui/src/lib/voice-route.ts
              ui/src/pages/chat/chat-composer-actions.test.ts
              ui/src/pages/chat/chat-composer-microphone.test.ts
              ui/src/pages/chat/chat-composer.test.ts
              ui/src/pages/chat/chat-pane-history.ts
              ui/src/pages/chat/chat-pane-retained-presentation.ts
              ui/src/pages/chat/chat-realtime-handoff.test.ts
              ui/src/pages/chat/chat-realtime.test.ts
              ui/src/pages/chat/chat-realtime.ts
              ui/src/pages/chat/chat-session-rail.test.ts
              ui/src/pages/chat/chat-view.test.ts
              ui/src/pages/chat/components/chat-composer-controls.tsx
              ui/src/pages/chat/components/chat-composer-dictation-options.ts
              ui/src/pages/chat/components/chat-composer-frame.ts
              ui/src/pages/chat/components/chat-composer-microphone-menu.tsx
              ui/src/pages/chat/components/chat-session-rail-composer.tsx
              ui/src/pages/chat/components/chat-session-rail.tsx
              ui/src/pages/chat/components/chat-voice-activity.tsx
              ui/src/pages/chat/components/composer-dictation-status.tsx
              ui/src/pages/chat/components/direct-dictation-view.tsx
              ui/src/pages/chat/composer-dictation-session.ts
              ui/src/pages/chat/composer-dictation.test.ts
              ui/src/pages/chat/composer-dictation.ts
              ui/src/pages/chat/composer-direct-dictation.test.tsx
              ui/src/pages/chat/composer-direct-dictation.ts
              ui/src/pages/chat/talk/chat-actions-runtime.ts
              ui/src/pages/chat/talk/consult.test.ts
              ui/src/pages/chat/talk/input.test-support.ts
              ui/src/pages/chat/talk/input.test.ts
              ui/src/pages/chat/talk/input.ts
              ui/src/pages/chat/talk/session-runtime-loading.test.ts
              ui/src/pages/chat/talk/session.test.ts
              ui/src/pages/chat/talk/session.ts
              ui/src/pages/chat/talk/shared.ts
              ui/src/pages/chat/talk/split.test.ts
              ui/src/pages/chat/talk/split.ts
              ui/src/pages/chat/talk/transcript-queue.test.ts
              ui/src/pages/new-session/draft-persistence.ts
              ui/src/pages/new-session/new-session-page-owner.ts
    env:
      CI: "true"
      SOURCE_REPOSITORY: CompleteDotTech/openclaw
      SOURCE_SHA: ${{ matrix.source_sha }}
      EXPECTED_SOURCE_TREE: ${{ matrix.source_tree }}
      SELECTION_BASE_SHA: ${{ matrix.selection_base_sha }}
      EXPECTED_SELECTION_BASE_TREE: ${{ matrix.selection_base_tree }}
      PROOF_LABEL: ${{ matrix.label }}
      PROOF_KIND: child-generated-patch-only
      WORKFLOW_SHA: ${{ github.workflow_sha }}
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"
      OPENCLAW_FORMAT_TOOL: oxfmt
      PNPM_CONFIG_FROZEN_LOCKFILE: "true"
      P06_FORMAT_FILES: ${{ matrix.format_files }}
      P06_GENERATED_FILES: |
        ui/src/i18n/.i18n/raw-copy-baseline.json
    steps:
      - name: Initialize artifact directory and require an exact commit
        run: |
          printf 'P06_PROOF_DIR=%s/p06-voice-generate\n' "$RUNNER_TEMP" >> "$GITHUB_ENV"
          [[ "$SOURCE_SHA" =~ ^[0-9a-f]{40}$ ]]
          [[ "$EXPECTED_SOURCE_TREE" =~ ^[0-9a-f]{40}$ ]]
          [[ "$SELECTION_BASE_SHA" =~ ^[0-9a-f]{40}$ ]]
          [[ "$EXPECTED_SELECTION_BASE_TREE" =~ ^[0-9a-f]{40}$ ]]

      - name: Checkout the exact child input
        id: checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ${{ env.SOURCE_REPOSITORY }}
          ref: ${{ env.SOURCE_SHA }}
          fetch-depth: 1
          persist-credentials: false

      - name: Record source and generator input identity
        id: identity
        run: |
          mkdir -p "$P06_PROOF_DIR"
          test "$(git rev-parse HEAD)" = "$SOURCE_SHA"
          test "$(git rev-parse 'HEAD^{tree}')" = "$EXPECTED_SOURCE_TREE"
          git -c core.hooksPath=/dev/null fetch --no-tags --depth=1 origin "$SELECTION_BASE_SHA"
          test "$(git rev-parse "$SELECTION_BASE_SHA^{tree}")" = "$EXPECTED_SELECTION_BASE_TREE"
          git diff --exit-code
          git diff --cached --exit-code
          python3 - <<'PY'
          import hashlib
          import json
          import os
          from pathlib import Path
          import subprocess

          proof = Path(os.environ["P06_PROOF_DIR"])
          selection = {}
          for label, variable in (("format", "P06_FORMAT_FILES"), ("generated", "P06_GENERATED_FILES")):
              files = os.environ[variable].splitlines()
              assert files and all(files) and len(files) == len(set(files))
              for name in files:
                  assert Path(name).is_file(), name
                  subprocess.check_call(["git", "ls-files", "--error-unmatch", "--", name], stdout=subprocess.DEVNULL)
              (proof / f"{label}-files.txt").write_text("\n".join(files) + "\n")
              selection[label] = files
          changed = subprocess.check_output(["git", "diff", "--name-only", "--no-renames", "--diff-filter=ACMRT", os.environ["SELECTION_BASE_SHA"], "HEAD"], text=True).splitlines()
          assert sorted(selection["format"]) == sorted(changed), "Format selection differs from pinned source delta."
          receipt = {
              "label": os.environ["PROOF_LABEL"],
              "selection_base_sha": os.environ["SELECTION_BASE_SHA"],
              "selection_base_tree": os.environ["EXPECTED_SELECTION_BASE_TREE"],
              "selection_base_purpose": "Formatting scope only; final guard base must be each review stage's actual parent.",
              "proof_kind": os.environ["PROOF_KIND"],
              "source_repository": os.environ["SOURCE_REPOSITORY"],
              "source_sha": subprocess.check_output(["git", "rev-parse", "HEAD"], text=True).strip(),
              "source_tree": subprocess.check_output(["git", "rev-parse", "HEAD^{tree}"], text=True).strip(),
              "workflow_repository": os.environ["GITHUB_REPOSITORY"],
              "workflow_ref": os.environ["GITHUB_WORKFLOW_REF"],
              "workflow_sha": os.environ["WORKFLOW_SHA"],
              "run_url": f"{os.environ['GITHUB_SERVER_URL']}/{os.environ['GITHUB_REPOSITORY']}/actions/runs/{os.environ['GITHUB_RUN_ID']}",
              "run_attempt": os.environ["GITHUB_RUN_ATTEMPT"],
              "selection": selection,
              "input_sha256": {
                  name: hashlib.sha256(Path(name).read_bytes()).hexdigest()
                  for name in sorted(set(selection["format"] + selection["generated"]))
              },
              "qualification": "Generation only. Tests, static checks, build, and browser proof are NOT RUN.",
          }
          (proof / "source.json").write_text(json.dumps(receipt, indent=2) + "\n")
          print(json.dumps(receipt, indent=2))
          PY

      - name: Prepare canonical Node and pnpm without shared caches
        id: toolchain
        uses: ./.github/actions/setup-node-env
        with:
          node-version: "24.22.1"
          install-bun: "false"
          install-deps: "false"
          semantic-checks: "true"
          cache-mode: "off"

      - name: Install this checkout's frozen dependencies
        id: install
        run: |
          {
            node --version
            pnpm --version
            pnpm install --frozen-lockfile
          } 2>&1 | tee "$P06_PROOF_DIR/install.log"
          git diff --exit-code
          git diff --cached --exit-code

      - name: Format only the explicit child source selection
        id: format
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: |
          mapfile -t format_files < "$P06_PROOF_DIR/format-files.txt"
          pnpm format --no-error-on-unmatched-pattern -- "${format_files[@]}" 2>&1 | tee "$P06_PROOF_DIR/format.log"

      - name: Generate the canonical Control UI raw-copy baseline
        id: i18n
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: |
          pnpm ui:i18n:baseline 2>&1 | tee "$P06_PROOF_DIR/i18n.log"

      - name: Retain an allowlisted patch without publishing code
        id: patch
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: |
          test "$(git rev-parse HEAD)" = "$SOURCE_SHA"
          git diff --cached --exit-code
          python3 - <<'PY'
          import hashlib
          import json
          import os
          from pathlib import Path
          import subprocess

          proof = Path(os.environ["P06_PROOF_DIR"])
          allowed = set((proof / "format-files.txt").read_text().splitlines())
          allowed.update((proof / "generated-files.txt").read_text().splitlines())
          changed = subprocess.check_output(["git", "diff", "--name-only", "-z"]).decode().split("\0")
          changed = [name for name in changed if name]
          unexpected = sorted(set(changed) - allowed)
          assert not unexpected, f"Generated changes escaped the explicit allowlist: {unexpected}"
          untracked = subprocess.check_output(["git", "ls-files", "--others", "--exclude-standard", "-z"])
          assert not untracked, "Unexpected nonignored untracked output; no patch is approved."
          patch = subprocess.check_output(["git", "diff", "--binary", "--full-index", "--no-ext-diff"])
          (proof / "generated.patch").write_bytes(patch)
          receipt = {
              "label": os.environ["PROOF_LABEL"],
              "input_sha": os.environ["SOURCE_SHA"],
              "changed_paths": changed,
              "patch_sha256": hashlib.sha256(patch).hexdigest(),
              "patch_bytes": len(patch),
              "output_sha256": {
                  name: hashlib.sha256(Path(name).read_bytes()).hexdigest()
                  for name in changed
              },
              "publication": "No commit, ref update, pull request, or code publication occurred in this job.",
          }
          (proof / "generated.json").write_text(json.dumps(receipt, indent=2) + "\n")
          print(json.dumps(receipt, indent=2))
          # Bounded public-source fallback if artifact download loses its local host.
          if len(patch) <= 200_000:
              print("P06_GENERATED_PATCH_BEGIN")
              print(patch.decode("utf-8"), end="")
              print("P06_GENERATED_PATCH_END")
          PY

      - name: Record every generation outcome
        if: always()
        env:
          CHECKOUT_RESULT: ${{ steps.checkout.outcome }}
          IDENTITY_RESULT: ${{ steps.identity.outcome }}
          TOOLCHAIN_RESULT: ${{ steps.toolchain.outcome }}
          INSTALL_RESULT: ${{ steps.install.outcome }}
          FORMAT_RESULT: ${{ steps.format.outcome }}
          I18N_RESULT: ${{ steps.i18n.outcome }}
          PATCH_RESULT: ${{ steps.patch.outcome }}
        run: |
          mkdir -p "$P06_PROOF_DIR"
          python3 - <<'PY'
          import json
          import os
          from pathlib import Path

          proof = Path(os.environ["P06_PROOF_DIR"])
          status = {"success": "PASS", "failure": "FAIL", "skipped": "NOT RUN", "": "NOT RUN", "cancelled": "CANCELLED"}
          outcomes = {
              name.lower().removesuffix("_result"): status[os.environ.get(name, "")]
              for name in ("CHECKOUT_RESULT", "IDENTITY_RESULT", "TOOLCHAIN_RESULT", "INSTALL_RESULT", "FORMAT_RESULT", "I18N_RESULT", "PATCH_RESULT")
          }
          for name in ("tests", "static_checks", "build", "browser", "live_microphone", "live_provider", "native_global", "stable_upgrade", "post_parent_merge"):
              outcomes[name] = "NOT RUN"
          (proof / "outcomes.json").write_text(json.dumps(outcomes, indent=2) + "\n")
          lines = ["## P06 generation only", "", "| Lane | Outcome |", "| --- | --- |"]
          lines.extend(f"| {name} | {value} |" for name, value in outcomes.items())
          lines.extend(["", "Apply and commit only a reviewed successful patch, then rerun proof against the resulting exact commit."])
          with open(os.environ["GITHUB_STEP_SUMMARY"], "a") as summary:
              summary.write("\n".join(lines) + "\n")
          PY

      - name: Retain only the generated patch and its receipts
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: p06-generated-${{ matrix.label }}-${{ github.run_id }}-${{ github.run_attempt }}
          retention-days: 7
          if-no-files-found: error
          path: |
            ${{ runner.temp }}/p06-voice-generate/source.json
            ${{ runner.temp }}/p06-voice-generate/outcomes.json
            ${{ runner.temp }}/p06-voice-generate/format-files.txt
            ${{ runner.temp }}/p06-voice-generate/generated-files.txt
            ${{ runner.temp }}/p06-voice-generate/install.log
            ${{ runner.temp }}/p06-voice-generate/format.log
            ${{ runner.temp }}/p06-voice-generate/i18n.log
            ${{ runner.temp }}/p06-voice-generate/generated.patch
            ${{ runner.temp }}/p06-voice-generate/generated.json
