# Evidence-only diagnostic. Exact product plus a disclosed failure-only test overlay.
'on':
  push:
    branches:
    - evidence/p06-voice-routes-20261126
permissions:
  contents: read
defaults:
  run:
    shell: bash --noprofile --norc -e -o pipefail {0}
name: P06 bounded voice-selection diagnostic
concurrency:
  group: p06-voice-diagnostic-${{ github.workflow_sha }}
  cancel-in-progress: false
jobs:
  diagnostic:
    name: Diagnose exact a3f1 voice replacement without product edits
    if: github.repository == 'CompleteDotTech/openclaw'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      CI: 'true'
      SOURCE_REPOSITORY: CompleteDotTech/openclaw
      SOURCE_SHA: a3f1ce0731e45a4a3f2c36ae9942cd0ffe4c3892
      WORKFLOW_SHA: ${{ github.workflow_sha }}
      PROOF_KIND: exact-product-with-failure-only-test-overlay
      HARNESS_SHA256: 8d4589c761f3110220b58db2026fcd1e3e45b16aac16245e570bebc93fbb2ec7
      HARNESS_SOURCE_PATH: ui/src/e2e/browser-talk-voice-selection.e2e.test.ts
      HARNESS_SOURCE_BLOB: 81fcab7b22ec04aeb5f5fc4845834f286927dcef
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: 'true'
      OPENCLAW_VITEST_RUNTIME: node
      OPENCLAW_VITEST_MAX_WORKERS: '1'
      OPENCLAW_TEST_PROJECTS_PARALLEL: '1'
      OPENCLAW_CAPTURE_UI_PROOF: '1'
      OPENCLAW_UI_E2E_SKIP_REAL_GATEWAY: '1'
      PNPM_CONFIG_FROZEN_LOCKFILE: 'true'
      EXPECTED_SOURCE_TREE: 11d5f8194eb7bac343093a5b186f63a072c45586
      EXPECTED_HARNESS_OUTPUT_SHA256: 10fbd5bd199821f3591c8a9f3b636ebc8c20f3a240c4294254691bc46d0677c8
      EXPECTED_HARNESS_INPUT_SHA256: b7e00f63097a46e38133348fa2d06dcd30aae6f3b5c2af07c02bfdd46565479a
    steps:
    - name: Initialize narrow diagnostic output
      run: |
        printf 'P06_PROOF_DIR=%s/p06-voice-diagnostic\n' "$RUNNER_TEMP" >> "$GITHUB_ENV"
    - name: Checkout the exact product source
      id: checkout
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      with:
        repository: ${{ env.SOURCE_REPOSITORY }}
        ref: ${{ env.SOURCE_SHA }}
        fetch-depth: '1'
        persist-credentials: 'false'
    - name: Verify exact product and original test identity
      id: identity
      run: |
        mkdir -p "$P06_PROOF_DIR"
        git diff --exit-code
        git diff --cached --exit-code
        python3 - <<'PY'
        import hashlib,json,os,subprocess
        from pathlib import Path
        env=os.environ
        def git(*args): return subprocess.check_output(["git",*args],text=True).strip()
        assert git("rev-parse","HEAD")==env["SOURCE_SHA"]
        assert git("rev-parse","HEAD^{tree}")==env["EXPECTED_SOURCE_TREE"]
        assert git("rev-parse","HEAD:"+env["HARNESS_SOURCE_PATH"])==env["HARNESS_SOURCE_BLOB"]
        assert hashlib.sha256(Path(env["HARNESS_SOURCE_PATH"]).read_bytes()).hexdigest()==env["EXPECTED_HARNESS_INPUT_SHA256"]
        receipt={
          "source_repository":env["SOURCE_REPOSITORY"],"source_sha":env["SOURCE_SHA"],"source_tree":env["EXPECTED_SOURCE_TREE"],
          "workflow_sha":env["WORKFLOW_SHA"],"workflow_ref":env["GITHUB_WORKFLOW_REF"],"proof_kind":env["PROOF_KIND"],
          "run_url":f"{env['GITHUB_SERVER_URL']}/{env['GITHUB_REPOSITORY']}/actions/runs/{env['GITHUB_RUN_ID']}",
          "test_file":env["HARNESS_SOURCE_PATH"],"original_test_blob":env["HARNESS_SOURCE_BLOB"],
          "original_test_sha256":env["EXPECTED_HARNESS_INPUT_SHA256"],"instrumented_test_sha256":env["EXPECTED_HARNESS_OUTPUT_SHA256"],
          "harness_patch_sha256":env["HARNESS_SHA256"],
          "qualification":"Diagnostic only: exact product with one disclosed failure-only test overlay; original wait/rethrow preserved. Synthetic RPC metadata/alerts/native held lock only; no transcript output.",
        }
        (Path(env["P06_PROOF_DIR"])/"source.json").write_text(json.dumps(receipt,indent=2)+"\n")
        print(json.dumps(receipt,indent=2))
        PY
    - name: Prepare canonical Node and pnpm without shared caches
      id: toolchain
      uses: ./.github/actions/setup-node-env
      with:
        node-version: 24.22.1
        install-bun: 'false'
        install-deps: 'false'
        semantic-checks: 'true'
        cache-mode: 'off'
    - name: Install this checkout's frozen dependencies
      id: install
      run: |
        {
          node --version
          pnpm --version
          pnpm install --frozen-lockfile
        } 2>&1 | tee "$P06_PROOF_DIR/install.log"
        git diff --exit-code
        git diff --cached --exit-code
    - name: Apply the disclosed failure-only telemetry overlay
      id: harness
      if: ${{ !cancelled() && steps.install.outcome == 'success' }}
      run: |
        cat > "$P06_PROOF_DIR/voice-selection-diagnostic.patch" <<'P06_VOICE_DIAGNOSTIC_PATCH'
        --- a/ui/src/e2e/browser-talk-voice-selection.e2e.test.ts
        +++ b/ui/src/e2e/browser-talk-voice-selection.e2e.test.ts
        @@ -99,7 +99,22 @@
                 voice: "alloy",
                 phase: "requested",
               });
        -      const replacement = await gateway.waitForRequest("talk.client.create", { after: 1 });
        +      const replacement = await gateway
        +        .waitForRequest("talk.client.create", { after: 1 })
        +        .catch(async (error) => {
        +          console.info("[p06-voice-selection-diagnostic]", JSON.stringify({
        +            requests: (await gateway.getRequests()).filter((request) =>
        +              ["talk.client.create", "talk.client.close", "talk.voice.complete"].includes(request.method),
        +            ),
        +            alerts: await page.getByRole("alert").allTextContents(),
        +            status: await page.locator(".agent-chat__voice-status").allTextContents(),
        +            stopTalkCount: await stopVoice.count(),
        +            heldCapture: await page.evaluate(async () =>
        +              (await navigator.locks.query()).held?.filter((lock) => lock.name === "openclaw-voice-capture"),
        +            ),
        +          }));
        +          throw error;
        +        });
               expect(replacement.params).toMatchObject({
                 sessionKey: "agent:main:main",
                 transport: "webrtc",
        P06_VOICE_DIAGNOSTIC_PATCH
        python3 - <<'PY'
        import hashlib,json,os,subprocess
        from pathlib import Path
        env=os.environ;proof=Path(env["P06_PROOF_DIR"]);patch=proof/"voice-selection-diagnostic.patch"
        assert hashlib.sha256(patch.read_bytes()).hexdigest()==env["HARNESS_SHA256"]
        subprocess.check_call(["git","-c","core.hooksPath=/dev/null","apply","--check",str(patch)])
        subprocess.check_call(["git","-c","core.hooksPath=/dev/null","apply",str(patch)])
        changed=subprocess.check_output(["git","diff","--name-only"],text=True).splitlines()
        assert changed==[env["HARNESS_SOURCE_PATH"]],changed
        assert hashlib.sha256(Path(changed[0]).read_bytes()).hexdigest()==env["EXPECTED_HARNESS_OUTPUT_SHA256"]
        (proof/"harness.json").write_text(json.dumps({"source_sha":env["SOURCE_SHA"],"patch_sha256":env["HARNESS_SHA256"],"changed_paths":changed,"instrumented_test_sha256":env["EXPECTED_HARNESS_OUTPUT_SHA256"]},indent=2)+"\n")
        PY
        git diff --cached --exit-code
    - name: Run only the original agent-requested voice-change case
      id: browser
      if: ${{ !cancelled() && steps.harness.outcome == 'success' }}
      env:
        OPENCLAW_UI_E2E_ARTIFACT_DIR: ${{ runner.temp }}/p06-voice-diagnostic/ui-proof
      run: |
        pnpm test:ui:e2e ui/src/e2e/browser-talk-voice-selection.e2e.test.ts --testNamePattern 'keeps the composer free of voice settings' --maxWorkers=1 --reporter=default --reporter=json --outputFile.json "$P06_PROOF_DIR/browser-result.json" 2>&1 | tee "$P06_PROOF_DIR/browser.log"
    - name: Verify product unchanged and retain selected-case result
      id: source-unchanged
      if: ${{ !cancelled() && steps.harness.outcome == 'success' }}
      run: |
        python3 - <<'PY' 2>&1 | tee "$P06_PROOF_DIR/source-unchanged.log"
        import hashlib,json,os,subprocess
        from pathlib import Path
        env=os.environ;proof=Path(env["P06_PROOF_DIR"])
        def git(*args):return subprocess.check_output(["git",*args],text=True).strip()
        assert git("rev-parse","HEAD")==env["SOURCE_SHA"]
        assert git("rev-parse","HEAD^{tree}")==env["EXPECTED_SOURCE_TREE"]
        assert git("diff","--name-only").splitlines()==[env["HARNESS_SOURCE_PATH"]]
        assert hashlib.sha256(Path(env["HARNESS_SOURCE_PATH"]).read_bytes()).hexdigest()==env["EXPECTED_HARNESS_OUTPUT_SHA256"]
        subprocess.check_call(["git","diff","--cached","--exit-code"])
        report=json.loads((proof/"browser-result.json").read_text())
        selected=[test for result in report["testResults"] for test in result["assertionResults"] if test["status"] in {"passed","failed"}]
        assert len(selected)==1 and selected[0]["title"]=="keeps the composer free of voice settings while preserving agent-requested voice changes"
        assert report["numTotalTests"]==3 and report["numPendingTests"]==2 and report["numTodoTests"]==0
        result={"executed":1,"passed":report["numPassedTests"],"failed":report["numFailedTests"],"filtered":2,"case":selected[0]["title"],"product_unchanged":True,"harness_unchanged":True,"qualification":"Diagnostic with disclosed test-only instrumentation; not final source qualification."}
        (proof/"diagnostic-result.json").write_text(json.dumps(result,indent=2)+"\n")
        print(json.dumps(result,indent=2))
        PY
    - name: Record narrow diagnostic outcomes
      if: always()
      env:
        CHECKOUT_RESULT: ${{ steps.checkout.outcome }}
        IDENTITY_RESULT: ${{ steps.identity.outcome }}
        TOOLCHAIN_RESULT: ${{ steps.toolchain.outcome }}
        INSTALL_RESULT: ${{ steps.install.outcome }}
        HARNESS_RESULT: ${{ steps.harness.outcome }}
        BROWSER_RESULT: ${{ steps.browser.outcome }}
        SOURCE_UNCHANGED_RESULT: ${{ steps.source-unchanged.outcome }}
      run: |
        mkdir -p "$P06_PROOF_DIR"
        python3 - <<'PY'
        import json,os
        from pathlib import Path
        status={"success":"PASS","failure":"FAIL","skipped":"NOT RUN","cancelled":"CANCELLED","":"NOT RUN"}
        outcomes={key.lower().removesuffix("_result"):status[value] for key,value in os.environ.items() if key.endswith("_RESULT")}
        outcomes.update({"full_tests":"NOT RUN","types":"NOT RUN","lint":"NOT RUN","full_browser_matrix":"NOT RUN","live_microphone":"NOT RUN","live_provider":"NOT RUN"})
        result={"proof_kind":os.environ["PROOF_KIND"],"source_sha":os.environ["SOURCE_SHA"],"workflow_sha":os.environ["WORKFLOW_SHA"],"outcomes":outcomes,"qualification":"Diagnostic only; original selected assertion failure is preserved."}
        (Path(os.environ["P06_PROOF_DIR"])/"outcomes.json").write_text(json.dumps(result,indent=2)+"\n")
        print(json.dumps(result,indent=2))
        PY
    - name: Retain only synthetic diagnostic logs and receipts
      if: always()
      uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
      with:
        name: p06-voice-selection-diagnostic-${{ github.run_id }}-${{ github.run_attempt }}
        retention-days: '7'
        if-no-files-found: error
        path: |
          ${{ runner.temp }}/p06-voice-diagnostic/source.json
          ${{ runner.temp }}/p06-voice-diagnostic/harness.json
          ${{ runner.temp }}/p06-voice-diagnostic/outcomes.json
          ${{ runner.temp }}/p06-voice-diagnostic/install.log
          ${{ runner.temp }}/p06-voice-diagnostic/browser.log
          ${{ runner.temp }}/p06-voice-diagnostic/browser-result.json
          ${{ runner.temp }}/p06-voice-diagnostic/diagnostic-result.json
          ${{ runner.temp }}/p06-voice-diagnostic/source-unchanged.log
          ${{ runner.temp }}/p06-voice-diagnostic/voice-selection-diagnostic.patch
