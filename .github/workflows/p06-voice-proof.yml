# Evidence-only frozen current-main scenario with one disclosed test-only screenshot overlay.
name: P06 frozen current-main matched browser baseline
'on':
  push:
    branches:
    - evidence/p06-voice-routes-20261126
permissions:
  contents: read
defaults:
  run:
    shell: bash --noprofile --norc -e -o pipefail {0}
concurrency:
  group: p06-main-before-a48488cc
  cancel-in-progress: false
jobs:
  main-browser:
    if: github.repository == 'CompleteDotTech/openclaw'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      CI: 'true'
      SOURCE_REPOSITORY: openclaw/openclaw
      SOURCE_SHA: a48488cc6c437dac9b4d34580c9c1436b1a08f1f
      WORKFLOW_SHA: ${{ github.workflow_sha }}
      PROOF_KIND: frozen-current-main-product-with-explicit-test-instrumentation
      HARNESS_SHA256: 9d5fa1631d0ac428febde2a98c1b0c65f8d943ecbdc4b2716ae0a5a931e40e55
      HARNESS_SOURCE_PATH: ui/src/e2e/browser-dictation-status.e2e.test.ts
      HARNESS_SOURCE_BLOB: eee72293c306f810321810ce9a7b0c5a9f1fe307
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: 'true'
      OPENCLAW_VITEST_RUNTIME: node
      OPENCLAW_VITEST_MAX_WORKERS: '1'
      OPENCLAW_TEST_PROJECTS_PARALLEL: '1'
      OPENCLAW_CAPTURE_UI_PROOF: '1'
      OPENCLAW_UI_E2E_SKIP_REAL_GATEWAY: '1'
      PNPM_CONFIG_FROZEN_LOCKFILE: 'true'
      EXPECTED_SOURCE_TREE: 3e5ea7d1938be96e3919e3f8561c5a90bdb1042a
      EXPECTED_HARNESS_OUTPUT_SHA256: ea89790018f80bb0dee1b4f571910bea37591aa3f5fbef6097717eb1a74a946e
    steps:
    - name: Initialize proof directory
      run: |
        printf 'P06_PROOF_DIR=%s/p06-main-browser\n' "$RUNNER_TEMP" >> "$GITHUB_ENV"
    - name: Checkout the exact current-main product
      id: checkout
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      with:
        repository: ${{ env.SOURCE_REPOSITORY }}
        ref: ${{ env.SOURCE_SHA }}
        fetch-depth: '1'
        persist-credentials: 'false'
    - name: Record pristine current-main product and test identity
      id: identity
      run: |
        mkdir -p "$P06_PROOF_DIR"
        test "$(git rev-parse HEAD)" = "$SOURCE_SHA"
        test "$(git rev-parse 'HEAD^{tree}')" = "$EXPECTED_SOURCE_TREE"
        test "$(git hash-object "$HARNESS_SOURCE_PATH")" = "$HARNESS_SOURCE_BLOB"
        git diff --exit-code
        git diff --cached --exit-code
        python3 - <<'PYCODE'
        import json
        import os
        from pathlib import Path
        import subprocess

        receipt = {
            "proof_kind": os.environ["PROOF_KIND"],
            "source_repository": os.environ["SOURCE_REPOSITORY"],
            "source_sha": subprocess.check_output(["git", "rev-parse", "HEAD"], text=True).strip(),
            "source_tree": subprocess.check_output(["git", "rev-parse", "HEAD^{tree}"], text=True).strip(),
            "workflow_repository": os.environ["GITHUB_REPOSITORY"],
            "workflow_ref": os.environ["GITHUB_WORKFLOW_REF"],
            "workflow_sha": os.environ["WORKFLOW_SHA"],
            "run_url": f"{os.environ['GITHUB_SERVER_URL']}/{os.environ['GITHUB_REPOSITORY']}/actions/runs/{os.environ['GITHUB_RUN_ID']}",
            "run_attempt": os.environ["GITHUB_RUN_ATTEMPT"],
            "harness_original_path": os.environ["HARNESS_SOURCE_PATH"],
            "harness_original_blob": os.environ["HARNESS_SOURCE_BLOB"],
            "harness_patch_sha256": os.environ["HARNESS_SHA256"],
            "matched_viewport": {"width": 1280, "height": 720, "device_scale_factor": 1},
            "matched_parent_fixture_blobs": {'ui/src/e2e/browser-talk-start-stop.fixtures.ts': '4ff7c79cebe4699f5b25f4fa6f20ac1989e0bd52', 'ui/src/e2e/control-ui-browser-options.test-support.ts': '319d3e0819c2567be154aefc86508c5af9086cd7', 'ui/src/e2e/control-ui-e2e-suite.test-support.ts': 'f195f753376e0128f4c323169820dfd3d822f2e1', 'ui/src/test-helpers/proof-annotations.ts': '881a3d4808f0af9279e50eb0b9ebcca3b0b38a3d', 'ui/src/test-helpers/control-ui-e2e-screenshot.ts': '6c5e846e3ce6cf85f781a2f1fcaed80aca327eb5'},
            "limitations": [
                "Only one unavailable-provider browser scenario is selected.",
                "Product is the exact frozen current main; its test file is instrumented solely for matched screenshot evidence.",
                "Microphone, provider and Gateway are synthetic fixtures; no live or native/global proof is claimed.",
            ],
        }
        (Path(os.environ["P06_PROOF_DIR"]) / "source.json").write_text(json.dumps(receipt, indent=2) + "\n")
        print(json.dumps(receipt, indent=2))
        PYCODE
    - name: Prepare canonical Node and pnpm without shared caches
      id: toolchain
      uses: ./.github/actions/setup-node-env
      with:
        node-version: 24.22.1
        install-bun: 'false'
        install-deps: 'false'
        semantic-checks: 'true'
        cache-mode: 'off'
    - name: Install this checkout's frozen dependencies
      id: install
      run: |
        {
          node --version
          pnpm --version
          pnpm install --frozen-lockfile
        } 2>&1 | tee "$P06_PROOF_DIR/install.log"
        git diff --exit-code
        git diff --cached --exit-code
    - name: Apply only the disclosed screenshot test instrumentation
      id: harness
      run: |
        cat > "$P06_PROOF_DIR/main-browser-annotations.patch" <<'P06_MAIN_HARNESS'
        --- a/ui/src/e2e/browser-dictation-status.e2e.test.ts
        +++ b/ui/src/e2e/browser-dictation-status.e2e.test.ts
        @@ -5,6 +5,7 @@
         import { finishElementAnimations } from "../test-helpers/animations.ts";
         import { takeControlUiScreenshotFrame } from "../test-helpers/control-ui-e2e-screenshot.ts";
         import { installMockGateway } from "../test-helpers/control-ui-e2e.ts";
        +import { rasterizeProofAnnotations } from "../test-helpers/proof-annotations.ts";
         import {
           captureComposerProof,
           installTalkBrowserFixtures,
        @@ -659,6 +660,38 @@
               await expect.poll(() => picker.getByRole("menuitem", { name: /Configure/ }).count()).toBe(2);
               await captureComposer(page, "microphone-picker-capability-gating.png");
               await captureFullPage(page, "microphone-picker-capability-gating-full");
        +      // Evidence-only overlay: product source remains the exact frozen current main.
        +      expect(page.viewportSize()).toEqual({ width: 1280, height: 720 });
        +      expect(await page.evaluate(() => devicePixelRatio)).toBe(1);
        +      const menu = picker.getByRole("menu", { name: "Microphone input", exact: true });
        +      const frame = await takeControlUiScreenshotFrame(
        +        page,
        +        page.locator(".agent-chat__composer-shell"),
        +        [menu],
        +        { elements: [menu], animations: "disabled" },
        +      );
        +      const measured = {
        +        viewport: page.viewportSize()!,
        +        scale: await page.evaluate(() => devicePixelRatio),
        +        annotations: [
        +          {
        +            kind: "outline" as const,
        +            rect: frame.elements[0]!.bounds,
        +            text: "Unavailable voice providers",
        +            labelAt: { x: 700, y: 180 },
        +            color: "#1d6b6a",
        +          },
        +        ],
        +      };
        +      await writeFile(path.join(suite.artifactDir, "main-before-capability-gating-clean.png"), frame.png);
        +      await writeFile(
        +        path.join(suite.artifactDir, "main-before-capability-gating-annotations.json"),
        +        JSON.stringify(measured, null, 2),
        +      );
        +      await writeFile(
        +        path.join(suite.artifactDir, "main-before-capability-gating-annotated.png"),
        +        await rasterizeProofAnnotations(suite.browser, { ...measured, image: frame.png }),
        +      );
               await picker.locator('[data-chat-talk-capability="dictation"]').focus();
               await page.keyboard.press("Enter");
               await expect.poll(() => new URL(page.url()).pathname).toBe("/settings/talk");
        P06_MAIN_HARNESS
        printf '%s  %s\n' "$HARNESS_SHA256" "$P06_PROOF_DIR/main-browser-annotations.patch" | sha256sum --check
        git apply --check "$P06_PROOF_DIR/main-browser-annotations.patch"
        git apply "$P06_PROOF_DIR/main-browser-annotations.patch"
        python3 - <<'PYCODE'
        import hashlib
        import json
        import os
        from pathlib import Path
        import subprocess

        changed = subprocess.check_output(["git", "diff", "--name-only"], text=True).splitlines()
        assert changed == [os.environ["HARNESS_SOURCE_PATH"]], changed
        assert hashlib.sha256(Path(changed[0]).read_bytes()).hexdigest() == os.environ["EXPECTED_HARNESS_OUTPUT_SHA256"]
        receipt = {
            "patch_sha256": os.environ["HARNESS_SHA256"],
            "changed_paths": changed,
            "instrumented_test_sha256": hashlib.sha256(Path(changed[0]).read_bytes()).hexdigest(),
        }
        (Path(os.environ["P06_PROOF_DIR"]) / "harness.json").write_text(json.dumps(receipt, indent=2) + "\n")
        print(json.dumps(receipt, indent=2))
        PYCODE
    - name: Capture the matched current-main scenario in real Chromium
      id: browser
      if: ${{ !cancelled() && steps.harness.outcome == 'success' }}
      run: |
        export OPENCLAW_UI_E2E_ARTIFACT_DIR="$P06_PROOF_DIR/ui-proof"
        pnpm test:ui:e2e "$HARNESS_SOURCE_PATH" --testNamePattern 'gates unavailable voice capabilities in the microphone picker' --maxWorkers=1 --reporter=default --reporter=json --outputFile.json "$P06_PROOF_DIR/browser-result.json" 2>&1 | tee "$P06_PROOF_DIR/browser.log"
        python3 - <<'PYCODE'
        import hashlib
        import json
        import os
        from pathlib import Path
        import struct

        proof = Path(os.environ["P06_PROOF_DIR"])
        report = json.loads((proof / "browser-result.json").read_text())
        assert report["success"] is True and report["numPassedTests"] == 1 and report["numFailedTests"] == 0
        assert report["numTodoTests"] == 0
        passed = [test for result in report["testResults"] for test in result["assertionResults"] if test["status"] == "passed"]
        assert len(passed) == 1 and passed[0]["title"] == "gates unavailable voice capabilities in the microphone picker"
        annotations = list(proof.glob("ui-proof/control-ui-browser-dictation-status-*/main-before-capability-gating-annotations.json"))
        assert len(annotations) == 1
        folder = annotations[0].parent
        measured = json.loads(annotations[0].read_text())
        assert measured["viewport"] == {"width": 1280, "height": 720} and measured["scale"] == 1
        captured = {}
        for kind in ("clean", "annotated"):
            path = folder / f"main-before-capability-gating-{kind}.png"
            data = path.read_bytes()
            assert data[:8] == b"\x89PNG\r\n\x1a\n" and struct.unpack(">II", data[16:24]) == (1280, 720)
            captured[kind] = {"path": str(path.relative_to(proof)), "sha256": hashlib.sha256(data).hexdigest(), "bytes": len(data)}
        (proof / "capture.json").write_text(json.dumps({"captures": captured, "annotations": measured, "selected_passed_tests": 1, "filtered_pending_tests": report["numPendingTests"]}, indent=2) + "\n")
        print(json.dumps(captured, indent=2))
        PYCODE
    - name: Confirm product and instrumented test remained unchanged
      id: source-unchanged
      if: ${{ !cancelled() && steps.harness.outcome == 'success' }}
      run: |
        test "$(git rev-parse HEAD)" = "$SOURCE_SHA"
        git diff --cached --exit-code
        git apply --reverse --check "$P06_PROOF_DIR/main-browser-annotations.patch"
        python3 - <<'PYCODE'
        import hashlib
        import json
        import os
        from pathlib import Path
        import subprocess

        proof = Path(os.environ["P06_PROOF_DIR"])
        receipt = json.loads((proof / "harness.json").read_text())
        changed = subprocess.check_output(["git", "diff", "--name-only"], text=True).splitlines()
        assert changed == receipt["changed_paths"]
        assert hashlib.sha256(Path(changed[0]).read_bytes()).hexdigest() == receipt["instrumented_test_sha256"]
        (proof / "integrity.json").write_text(json.dumps({"product_unchanged": True, "instrumented_test_unchanged": True}, indent=2) + "\n")
        PYCODE
    - name: Record baseline browser outcome and limits
      if: always()
      env:
        CHECKOUT_RESULT: ${{ steps.checkout.outcome }}
        IDENTITY_RESULT: ${{ steps.identity.outcome }}
        TOOLCHAIN_RESULT: ${{ steps.toolchain.outcome }}
        INSTALL_RESULT: ${{ steps.install.outcome }}
        HARNESS_RESULT: ${{ steps.harness.outcome }}
        BROWSER_RESULT: ${{ steps.browser.outcome }}
        INTEGRITY_RESULT: ${{ steps.source-unchanged.outcome }}
      run: |
        mkdir -p "$P06_PROOF_DIR"
        python3 - <<'PYCODE'
        import json
        import os
        from pathlib import Path

        status = {"success": "PASS", "failure": "FAIL", "skipped": "NOT RUN", "": "NOT RUN", "cancelled": "CANCELLED"}
        outcomes = {
            name.lower().removesuffix("_result"): status[os.environ.get(name, "")]
            for name in ("CHECKOUT_RESULT", "IDENTITY_RESULT", "TOOLCHAIN_RESULT", "INSTALL_RESULT", "HARNESS_RESULT", "BROWSER_RESULT", "INTEGRITY_RESULT")
        }
        for name in ("live_microphone", "live_provider", "native_global", "stable_upgrade", "post_parent_merge"):
            outcomes[name] = "NOT RUN"
        (Path(os.environ["P06_PROOF_DIR"]) / "outcomes.json").write_text(json.dumps(outcomes, indent=2) + "\n")
        lines = ["## P06 matched current-main browser scenario", "", "One disclosed test-file instrumentation patch; product source remains exact frozen current main.", "", "| Lane | Outcome |", "| --- | --- |"]
        lines.extend(f"| {name} | {value} |" for name, value in outcomes.items())
        with open(os.environ["GITHUB_STEP_SUMMARY"], "a") as summary:
            summary.write("\n".join(lines) + "\n")
        PYCODE
    - name: Retain only current-main screenshot evidence and instrumentation receipts
      if: always()
      uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
      with:
        name: p06-main-browser-${{ github.run_id }}-${{ github.run_attempt }}
        retention-days: 7
        if-no-files-found: error
        path: |
          ${{ runner.temp }}/p06-main-browser/source.json
          ${{ runner.temp }}/p06-main-browser/outcomes.json
          ${{ runner.temp }}/p06-main-browser/harness.json
          ${{ runner.temp }}/p06-main-browser/integrity.json
          ${{ runner.temp }}/p06-main-browser/main-browser-annotations.patch
          ${{ runner.temp }}/p06-main-browser/install.log
          ${{ runner.temp }}/p06-main-browser/browser.log
          ${{ runner.temp }}/p06-main-browser/ui-proof/control-ui-browser-dictation-status-*/main-before-capability-gating-clean.png
          ${{ runner.temp }}/p06-main-browser/ui-proof/control-ui-browser-dictation-status-*/main-before-capability-gating-annotated.png
          ${{ runner.temp }}/p06-main-browser/ui-proof/control-ui-browser-dictation-status-*/main-before-capability-gating-annotations.json
          ${{ runner.temp }}/p06-main-browser/browser-result.json
          ${{ runner.temp }}/p06-main-browser/capture.json
    name: Capture matched frozen current-main unavailable-provider scene
