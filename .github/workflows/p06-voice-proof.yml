            ui/src/e2e/browser-talk-voice-selection.e2e.test.ts
            ui/src/e2e/browser-voice-routes.e2e.test.ts
          expected_browser_tests: 4
    name: P06 ${{ matrix.label }} execution
  guards:
    if: github.repository == 'CompleteDotTech/openclaw'
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      CI: 'true'
      SOURCE_REPOSITORY: CompleteDotTech/openclaw
      SOURCE_SHA: ${{ matrix.source_sha }}
      PROOF_KIND: exact-committed-stage-proof
      WORKFLOW_SHA: ${{ github.workflow_sha }}
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: 'true'
      OPENCLAW_VITEST_RUNTIME: node
      OPENCLAW_VITEST_MAX_WORKERS: '1'
      OPENCLAW_TEST_PROJECTS_PARALLEL: '1'
      OPENCLAW_TYPECHECKER: tsgo
      OPENCLAW_LINT_TOOL: oxlint
      OPENCLAW_FORMAT_TOOL: oxfmt
      PNPM_CONFIG_FROZEN_LOCKFILE: 'true'
      P06_TEST_FILES: ${{ matrix.test_files }}
      P06_SOURCE_FILES: ${{ matrix.source_files }}
      EXPECTED_SOURCE_TREE: ${{ matrix.source_tree }}
      BASE_SHA: ${{ matrix.base_sha }}
      EXPECTED_BASE_TREE: ${{ matrix.base_tree }}
      SELECTION_BASE_SHA: ${{ matrix.selection_base_sha }}
      EXPECTED_SELECTION_BASE_TREE: ${{ matrix.selection_base_tree }}
      PROOF_LABEL: ${{ matrix.label }}
      P06_FORMAT_FILES: ${{ matrix.format_files }}
      P06_BROWSER_FILES: ${{ matrix.browser_files }}
      GOGC: '30'
      GOMEMLIMIT: 3GiB
      PROOF_LANE: guards
    steps:
    - name: Initialize proof directory and require immutable identities
      run: |
        printf 'P06_PROOF_DIR=%s/p06-voice-proof\n' "$RUNNER_TEMP" >> "$GITHUB_ENV"
        for value in "$SOURCE_SHA" "$EXPECTED_SOURCE_TREE" "$BASE_SHA" "$EXPECTED_BASE_TREE" "$SELECTION_BASE_SHA" "$EXPECTED_SELECTION_BASE_TREE"; do
          [[ "$value" =~ ^[0-9a-f]{40}$ ]]
        done
    - name: Install the required system search tool
      id: prerequisites
      run: |
        mkdir -p "$P06_PROOF_DIR"
        {
          if ! command -v rg >/dev/null 2>&1; then
            sudo apt-get update
            sudo apt-get install --yes --no-install-recommends ripgrep
          fi
          rg --version
        } 2>&1 | tee "$P06_PROOF_DIR/prerequisites.log"
    - name: Checkout the exact committed stage
      id: checkout
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      with:
        repository: ${{ env.SOURCE_REPOSITORY }}
        ref: ${{ env.SOURCE_SHA }}
        fetch-depth: '1'
        persist-credentials: 'false'
    - name: Verify source, review base, and proof selection identities
      id: identity
      run: |
        mkdir -p "$P06_PROOF_DIR"
        test "$(git rev-parse HEAD)" = "$SOURCE_SHA"
        test "$(git rev-parse 'HEAD^{tree}')" = "$EXPECTED_SOURCE_TREE"
        for ref in "$BASE_SHA" "$SELECTION_BASE_SHA"; do
          git -c core.hooksPath=/dev/null fetch --no-tags --depth=1 origin "$ref"
        done
        test "$(git rev-parse "$BASE_SHA^{tree}")" = "$EXPECTED_BASE_TREE"
        test "$(git rev-parse "$SELECTION_BASE_SHA^{tree}")" = "$EXPECTED_SELECTION_BASE_TREE"
        git diff --exit-code
        git diff --cached --exit-code
        python3 - <<'PY'
        import hashlib
        import json
        import os
        from pathlib import Path
        import subprocess

        proof = Path(os.environ["P06_PROOF_DIR"])
        selected = {}
        for label, variable in (("format", "P06_FORMAT_FILES"), ("source", "P06_SOURCE_FILES"), ("test", "P06_TEST_FILES"), ("browser", "P06_BROWSER_FILES")):
            files = os.environ[variable].splitlines()
            assert label == "browser" or files, f"Missing selection: {label}"
            assert all(files) and len(files) == len(set(files))
            for name in files:
                path = Path(name)
                assert not path.is_absolute() and ".." not in path.parts and path.is_file(), name
                subprocess.check_call(["git", "ls-files", "--error-unmatch", "--", name], stdout=subprocess.DEVNULL)
            (proof / f"{label}-files.txt").write_text("\n".join(files) + ("\n" if files else ""))
            selected[label] = files
        changed = subprocess.check_output(["git", "diff", "--name-only", "--no-renames", "--diff-filter=ACMRT", os.environ["SELECTION_BASE_SHA"], "HEAD"], text=True).splitlines()
        assert sorted(selected["format"]) == sorted(changed), "Format selection differs from the pinned source delta."
        receipt = {
            "label": os.environ["PROOF_LABEL"],
            "proof_kind": os.environ["PROOF_KIND"],
            "proof_lane": os.environ["PROOF_LANE"],
            "source_repository": os.environ["SOURCE_REPOSITORY"],
            "source_sha": os.environ["SOURCE_SHA"],
            "source_tree": os.environ["EXPECTED_SOURCE_TREE"],
            "review_base_sha": os.environ["BASE_SHA"],
            "review_base_tree": os.environ["EXPECTED_BASE_TREE"],
            "selection_base_sha": os.environ["SELECTION_BASE_SHA"],
            "selection_base_tree": os.environ["EXPECTED_SELECTION_BASE_TREE"],
            "workflow_repository": os.environ["GITHUB_REPOSITORY"],
            "workflow_ref": os.environ["GITHUB_WORKFLOW_REF"],
            "workflow_sha": os.environ["WORKFLOW_SHA"],
            "run_url": f"{os.environ['GITHUB_SERVER_URL']}/{os.environ['GITHUB_REPOSITORY']}/actions/runs/{os.environ['GITHUB_RUN_ID']}",
            "run_attempt": os.environ["GITHUB_RUN_ATTEMPT"],
            "selection": selected,
            "selected_source_sha256": {name: hashlib.sha256(Path(name).read_bytes()).hexdigest() for name in sorted(set(sum(selected.values(), [])))},
            "limitations": [
                "Synthetic Gateway, media, and provider fixtures only; no live credentials or microphone hardware.",
                "Native/global, stable upgrade, and post-parent-merge qualification are NOT RUN.",
                "Ratchets compare this exact stage to its actual review base, without synthesizing a PR merge checkout.",
            ],
        }
        (proof / "source.json").write_text(json.dumps(receipt, indent=2) + "\n")
        print(json.dumps(receipt, indent=2))
        PY
        {
          uname -a
          getconf _NPROCESSORS_ONLN
          free -m
          df -h .
        } 2>&1 | tee "$P06_PROOF_DIR/resources.log"
    - name: Prepare canonical Node and pnpm without shared caches
      id: toolchain
      uses: ./.github/actions/setup-node-env
      with:
        node-version: 24.22.1
        install-bun: 'false'
        install-deps: 'false'
        semantic-checks: 'true'
        cache-mode: 'off'
    - name: Install this checkout's frozen dependencies
      id: install
      run: |
        {
          node --version
          pnpm --version
          pnpm install --frozen-lockfile
        } 2>&1 | tee "$P06_PROOF_DIR/install.log"
        git diff --exit-code
        git diff --cached --exit-code
    - name: Check conflict markers
      id: conflict-markers
      if: ${{ !cancelled() && steps.install.outcome == 'success' }}
      run: |
        pnpm check:no-conflict-markers 2>&1 | tee "$P06_PROOF_DIR/conflict-markers.log"
    - name: Check the canonical UI type graph boundary
      id: ui-type-graph-boundary
      if: ${{ !cancelled() && steps.install.outcome == 'success' }}
      run: |
        pnpm lint:tmp:tsgo-core-boundary 2>&1 | tee "$P06_PROOF_DIR/ui-type-graph-boundary.log"
    - name: Check Control UI ownership against the actual review base
      id: ui-controller-ownership
      if: ${{ !cancelled() && steps.install.outcome == 'success' }}
      run: |
        pnpm check:control-ui-controllers --base "$BASE_SHA" --no-merge-base 2>&1 | tee "$P06_PROOF_DIR/ui-controller-ownership.log"
    - name: Check line caps against the actual review base
      id: line-cap
      if: ${{ !cancelled() && steps.install.outcome == 'success' }}
      run: |
        pnpm check:line-cap-ratchet --base "$BASE_SHA" --no-merge-base 2>&1 | tee "$P06_PROOF_DIR/line-cap.log"
    - name: Check baseline ratchets including per-stage test-line allocations
      id: baseline-ratchets
      if: ${{ !cancelled() && steps.install.outcome == 'success' }}
      run: |
        pnpm check:baseline-ratchets --base "$BASE_SHA" --no-merge-base 2>&1 | tee "$P06_PROOF_DIR/baseline-ratchets.log"
    - name: Check canonical architecture owners
      id: architecture
      if: ${{ !cancelled() && steps.install.outcome == 'success' }}
      run: |
        pnpm check:architecture 2>&1 | tee "$P06_PROOF_DIR/architecture.log"
    - name: Confirm tracked source remained unchanged
      id: source-unchanged
      if: ${{ !cancelled() && steps.identity.outcome == 'success' }}
      run: |
        {
          test "$(git rev-parse HEAD)" = "$SOURCE_SHA"
          test "$(git rev-parse 'HEAD^{tree}')" = "$EXPECTED_SOURCE_TREE"
          git diff --exit-code
          git diff --cached --exit-code
        } 2>&1 | tee "$P06_PROOF_DIR/source-unchanged.log"
    - name: Record every observed lane and unrun qualification
      if: always()
      env:
        CHECKOUT_RESULT: ${{ steps.checkout.outcome }}
        IDENTITY_RESULT: ${{ steps.identity.outcome }}
        TOOLCHAIN_RESULT: ${{ steps.toolchain.outcome }}
        INSTALL_RESULT: ${{ steps.install.outcome }}
        CONFLICT_MARKERS_RESULT: ${{ steps.conflict-markers.outcome }}
        UI_TYPE_GRAPH_BOUNDARY_RESULT: ${{ steps.ui-type-graph-boundary.outcome }}
        UI_CONTROLLER_OWNERSHIP_RESULT: ${{ steps.ui-controller-ownership.outcome }}
        LINE_CAP_RESULT: ${{ steps.line-cap.outcome }}
        BASELINE_RATCHETS_RESULT: ${{ steps.baseline-ratchets.outcome }}
        ARCHITECTURE_RESULT: ${{ steps.architecture.outcome }}
        SOURCE_UNCHANGED_RESULT: ${{ steps.source-unchanged.outcome }}
        PREREQUISITES_RESULT: ${{ steps.prerequisites.outcome }}
      run: |
        mkdir -p "$P06_PROOF_DIR"
        python3 - <<'PY'
        import json
        import os
        from pathlib import Path

        proof = Path(os.environ["P06_PROOF_DIR"])
        labels = {"success": "PASS", "failure": "FAIL", "skipped": "NOT RUN", "cancelled": "CANCELLED", "": "NOT RUN"}
        outcomes = {name.lower().removesuffix("_result"): labels[os.environ.get(name, "")] for name in ('CHECKOUT_RESULT', 'IDENTITY_RESULT', 'TOOLCHAIN_RESULT', 'INSTALL_RESULT', 'CONFLICT_MARKERS_RESULT', 'UI_TYPE_GRAPH_BOUNDARY_RESULT', 'UI_CONTROLLER_OWNERSHIP_RESULT', 'LINE_CAP_RESULT', 'BASELINE_RATCHETS_RESULT', 'ARCHITECTURE_RESULT', 'SOURCE_UNCHANGED_RESULT', 'PREREQUISITES_RESULT')}
        for name in ("live_microphone", "live_provider", "native_global", "stable_upgrade", "post_parent_merge"):
            outcomes[name] = "NOT RUN"
        receipt = {
            "label": os.environ["PROOF_LABEL"],
            "proof_kind": os.environ["PROOF_KIND"],
            "proof_lane": os.environ["PROOF_LANE"],
            "source_sha": os.environ["SOURCE_SHA"],
            "source_tree": os.environ["EXPECTED_SOURCE_TREE"],
            "review_base_sha": os.environ["BASE_SHA"],
            "workflow_sha": os.environ["WORKFLOW_SHA"],
            "outcomes": outcomes,
        }
        (proof / "outcomes.json").write_text(json.dumps(receipt, indent=2) + "\n")
        summary = [f"## P06 {os.environ['PROOF_LABEL']} committed-stage proof", "", f"Source `{os.environ['SOURCE_SHA']}`; review base `{os.environ['BASE_SHA']}`.", "", "| Lane | Observed result |", "| --- | --- |"]
        summary.extend(f"| {name} | {result} |" for name, result in outcomes.items())
        with open(os.environ["GITHUB_STEP_SUMMARY"], "a") as output:
            output.write("\n".join(summary) + "\n")
        print(json.dumps(receipt, indent=2))
        PY
