# Evidence-only scripted audio proof for OpenClaw dictation PRs.
# OpenAI text-to-speech turns each scenario phrase into a WAV, and a PR-specific
# Playwright harness plays it to Chromium as a fake microphone while the PR's own
# Gateway uses live OpenAI transcription. Every run hears exactly the same words.
#
# Runs only on pushes to this branch. Each PR has proof/<pr>/scenario.json and its
# harness script, and an entry in proof/run.json: { "runs": [ { "pr", "sha", "dir",
# "script" } ] } (an entry with "enabled": false is skipped). A push proves only the
# PRs whose proof/<pr>/ files or run.json entry changed; a change to the clip
# builder or this workflow proves all of them. Put "[proof: all]" or
# "[proof: 206088,205788]" in the pushed commit message to choose explicitly.
# Each PR runs as its own job; a newer push for the same PR cancels the older job.
name: Scripted audio dictation proof
'on':
  push:
    branches:
    - ct-scripted-audio-proof
    paths:
    - proof/**
    - .github/workflows/scripted-audio-proof.yml
permissions:
  contents: read
defaults:
  run:
    shell: bash --noprofile --norc -e -o pipefail {0}
jobs:
  plan:
    name: Pick the PRs to prove
    if: github.repository == 'CompleteDotTech/openclaw'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    outputs:
      matrix: ${{ steps.pick.outputs.matrix }}
      count: ${{ steps.pick.outputs.count }}
    steps:
    - name: Check out the harness branch
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        path: harness
        persist-credentials: 'false'
    - name: Read run.json and pick the changed PRs
      id: pick
      env:
        GH_TOKEN: ${{ github.token }}
        BEFORE: ${{ github.event.before }}
        AFTER: ${{ github.sha }}
        HEAD_MESSAGE: ${{ github.event.head_commit.message }}
      run: |
        normalize='if type == "object" and has("runs") then .runs else [.] end | map(select(.enabled != false) | {pr: (.pr | tostring), sha, dir, script})'
        runs=$(jq -c "$normalize" harness/proof/run.json)
        jq -e 'length > 0 and all(.[];
            (.pr | test("^[0-9]+$")) and (.sha | test("^[0-9a-f]{40}$")) and
            (.dir | test("^proof/[A-Za-z0-9._-]+$")) and (.script | test("^[A-Za-z0-9._-]+\\.[cm]?js$")))
          and (map(.pr) | length == (unique | length))' <<<"$runs" >/dev/null \
          || { echo "run.json: every entry needs a numeric pr, a full 40-character sha, dir proof/<name> and a .js/.mjs/.cjs script, with no duplicate PRs"; exit 1; }
        while read -r dir script; do
          test -f "harness/$dir/scenario.json" && test -f "harness/$dir/$script" || { echo "Missing scenario.json or $script in $dir"; exit 1; }
        done < <(jq -r '.[] | "\(.dir) \(.script)"' <<<"$runs")

        pick=$(grep -o '\[proof: *[a-z0-9, ]*\]' <<<"$HEAD_MESSAGE" | head -n1 | sed 's/^\[proof: *//; s/\]$//; s/ //g' || true)
        if [[ "$pick" == all ]] || [[ "$BEFORE" =~ ^0+$ ]]; then
          selected=$runs
        elif [[ -n "$pick" ]]; then
          selected=$(jq -c --arg pick "$pick" '($pick | split(",")) as $want | map(select(.pr as $p | $want | index($p)))' <<<"$runs")
        elif ! changed=$(gh api "repos/$GITHUB_REPOSITORY/compare/$BEFORE...$AFTER" --jq '[.files[].filename]'); then
          echo "Could not list the changed files, so every PR runs."
          selected=$runs
        elif jq -e 'any(.[]; . == "proof/make-clips.mjs" or . == ".github/workflows/scripted-audio-proof.yml")' <<<"$changed" >/dev/null; then
          selected=$runs
        else
          previous=$(gh api "repos/$GITHUB_REPOSITORY/contents/proof/run.json?ref=$BEFORE" -H "Accept: application/vnd.github.raw" 2>/dev/null | jq -c "$normalize" 2>/dev/null || echo '[]')
          selected=$(jq -c --argjson changed "$changed" --argjson previous "$previous" \
            'map(. as $r | select(($changed | any(startswith($r.dir + "/"))) or (($previous | index($r)) == null)))' <<<"$runs")
        fi
        echo "Proving: $(jq -r 'map("#" + .pr) | join(", ")' <<<"$selected")"
        { echo "matrix=$(jq -c . <<<"$selected")"; echo "count=$(jq length <<<"$selected")"; } >> "$GITHUB_OUTPUT"
  proof:
    name: 'Scripted audio proof #${{ matrix.pr }}'
    needs: plan
    if: needs.plan.outputs.count != '0'
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    concurrency:
      group: scripted-audio-proof-pr${{ matrix.pr }}
      cancel-in-progress: true
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.plan.outputs.matrix) }}
    env:
      CI: 'true'
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: 'true'
      PNPM_CONFIG_FROZEN_LOCKFILE: 'true'
      PR: ${{ matrix.pr }}
      SHA: ${{ matrix.sha }}
      DIR: ${{ matrix.dir }}
      SCRIPT: ${{ matrix.script }}
    steps:
    - name: Check out the harness branch
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        path: harness
        persist-credentials: 'false'
    - name: Check out the exact PR head
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        repository: CompleteDotTech/openclaw
        ref: ${{ matrix.sha }}
        path: pr
        fetch-depth: '1'
        persist-credentials: 'false'
    - name: Verify and record the source under test
      run: |
        test "$(git -C pr rev-parse HEAD)" = "$SHA"
        jq -n --arg pr "$PR" --arg sha "$SHA" --arg tree "$(git -C pr rev-parse 'HEAD^{tree}')" \
          --arg harness "$(git -C harness rev-parse HEAD)" --arg run "$GITHUB_RUN_ID" \
          '{pr: $pr, head: $sha, tree: $tree, harness_commit: $harness, run_id: $run}' | tee "harness/$DIR/source.json"
    - name: Set up Node
      uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
      with:
        node-version: 24.22.1
    - name: Install and build the PR (no secrets)
      working-directory: pr
      run: |
        corepack enable pnpm
        npm install --global bun@1.4.4
        node --version; pnpm --version
        pnpm install --frozen-lockfile
        NODE_OPTIONS=--max-old-space-size=8192 pnpm build:ci-artifacts
        pnpm --dir ui exec playwright install --with-deps chromium
    - name: Turn off swap before the secret is used
      run: |
        sudo swapoff -a
        test "$(wc -l < /proc/swaps)" -eq 1
    - name: Generate the scripted audio clips
      env:
        OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
      run: |
        node harness/proof/make-clips.mjs "harness/$DIR/scenario.json"
        cat "harness/$DIR/clips/script.md" >> "$GITHUB_STEP_SUMMARY"
    - name: Run the browser proof
      env:
        OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
      run: |
        ulimit -c 0
        node "harness/$DIR/$SCRIPT" "$GITHUB_WORKSPACE/pr"
    - name: Summarize the cases
      if: always()
      run: |
        shopt -s nullglob
        {
          echo "## Case results for #$PR"
          for f in harness/"$DIR"/results/run-*/*/case.json; do
            echo "- $(basename "$(dirname "$f")"): $(jq -r '.status + (if .detail then " (" + .detail + ")" else "" end)' "$f")"
          done
          echo
          echo "Result files:"
          echo '```'
          (cd "harness/$DIR" && find results -type f 2>/dev/null | sort | head -n 80)
          echo '```'
        } >> "$GITHUB_STEP_SUMMARY"
    - name: Upload the proof bundle
      if: always()
      uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
      with:
        name: scripted-audio-proof-pr${{ matrix.pr }}-${{ github.run_id }}
        path: |
          harness/${{ matrix.dir }}/source.json
          harness/${{ matrix.dir }}/clips/
          harness/${{ matrix.dir }}/results/
        retention-days: 30
        if-no-files-found: warn
