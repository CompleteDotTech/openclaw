# Evidence-only scripted audio proof for OpenClaw dictation PRs.
# OpenAI text-to-speech turns each scenario phrase into a WAV, and a PR-specific
# Playwright harness plays it to Chromium as a fake microphone while the PR's own
# Gateway uses live OpenAI transcription. Every run hears exactly the same words.
#
# Runs only on pushes to this branch. Each PR has proof/<pr>/scenario.json and its
# harness script, and an entry in proof/run.json: { "runs": [ { "pr", "sha", "dir",
# "script" } ] } (an entry with "enabled": false is skipped). Optional entry fields,
# all used before any secret:
#   "tests"      PR test files, run with pnpm test <files> --maxWorkers=1.
#   "checks"     package scripts, each a name ("lint") or a name with arguments
#                (["ui:check-performance:base", "<sha>"]), run with pnpm run.
#                If a listed test or check fails, the live proof is skipped and the
#                job fails.
#   "checkouts"  extra source trees, [{ "name", "repo", "sha", "build" }], with repo
#                openclaw/openclaw or CompleteDotTech/openclaw. Each is installed, and
#                built when "build" is true, under checkouts/<name>; its commit is
#                also fetched into the PR checkout so scripts can compare against it.
#   "stable"     a released openclaw version, installed from npm under stable/.
#   "offline"    lane scripts in proof/<pr>/ that need no secret (upgrade, recovery,
#                red-on-base). Each runs with node; a failure fails the job but does
#                not skip the live proof.
#   "live"       false skips clip generation and the browser proof, so the job never
#                sees OPENAI_API_KEY (for build, test and secretless-lane-only runs).
#                Such an entry needs no script or scenario.json, but must list at
#                least one test, check or offline lane.
# The harness and lane scripts get the PR checkout path as argv[2] and the
# environment variables PROOF_PR_DIR, PROOF_RESULTS_DIR, PROOF_CHECKOUTS (JSON
# object, name -> path) and PROOF_STABLE_DIR (empty when there is no stable install).
# A push proves only the PRs whose proof/<pr>/ files or run.json entry changed; a
# change to the clip builder or this workflow proves all of them. Put "[proof: all]"
# or "[proof: 206088,205788]" in the pushed commit message to choose explicitly.
# Each PR runs as its own job; a newer push for the same PR cancels the older job.
name: Scripted audio dictation proof
'on':
  push:
    branches:
    - ct-scripted-audio-proof
    paths:
    - proof/**
    - .github/workflows/scripted-audio-proof.yml
permissions:
  contents: read
defaults:
  run:
    shell: bash --noprofile --norc -e -o pipefail {0}
jobs:
  plan:
    name: Pick the PRs to prove
    if: github.repository == 'CompleteDotTech/openclaw'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    outputs:
      matrix: ${{ steps.pick.outputs.matrix }}
      count: ${{ steps.pick.outputs.count }}
    steps:
    - name: Check out the harness branch
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        path: harness
        persist-credentials: 'false'
    - name: Read run.json and pick the changed PRs
      id: pick
      env:
        GH_TOKEN: ${{ github.token }}
        BEFORE: ${{ github.event.before }}
        AFTER: ${{ github.sha }}
        HEAD_MESSAGE: ${{ github.event.head_commit.message }}
      run: |
        normalize='if type == "object" and has("runs") then .runs else [.] end | map(select(.enabled != false) | {pr: (.pr | tostring), sha, dir, script, tests: (.tests // []),
          checks: ((.checks // []) | if type == "array" then map(if type == "string" then [.] else . end) else . end),
          checkouts: ((.checkouts // []) | if type == "array" then map(if type == "object" then {name, repo, sha, build: (.build // false)} else . end) else . end),
          stable: (.stable // ""), offline: (.offline // []), live: (if .live == null then true else .live end)})'
        runs=$(jq -c "$normalize" harness/proof/run.json)
        jq -e 'length > 0 and all(.[];
            (.pr | test("^[0-9]+$")) and (.sha | type == "string" and test("^[0-9a-f]{40}$")) and
            (.dir | type == "string" and test("^proof/[A-Za-z0-9._-]+$")) and
            (if .live == false then (.script == null or (.script | type == "string" and test("^[A-Za-z0-9._-]+\\.[cm]?js$"))) and ((.tests | length) + (.checks | length) + (.offline | length) > 0)
             else (.script | type == "string" and test("^[A-Za-z0-9._-]+\\.[cm]?js$")) end) and
            (.tests | type == "array" and all(.[]; type == "string" and test("^[A-Za-z0-9_][A-Za-z0-9._/-]*\\.test\\.[cm]?[jt]sx?$") and (contains("..") | not))) and
            (.checks | type == "array" and all(.[]; type == "array" and length > 0 and (.[0] | type == "string" and test("^[a-z][a-z0-9:_-]*$")) and all(.[1:][]; type == "string" and test("^[A-Za-z0-9._:/=@+-]+$")))) and
            (.checkouts | type == "array" and all(.[]; type == "object" and (.name | type == "string" and test("^[a-z][a-z0-9-]{0,30}$")) and (.repo | IN("openclaw/openclaw", "CompleteDotTech/openclaw")) and (.sha | type == "string" and test("^[0-9a-f]{40}$")) and (.build | type == "boolean")) and (map(.name) | length == (unique | length))) and
            (.stable | type == "string" and test("^([0-9]+\\.[0-9]+\\.[0-9]+(-[0-9A-Za-z.]+)?)?$")) and
            (.offline | type == "array" and all(.[]; type == "string" and test("^[A-Za-z0-9._-]+\\.[cm]?js$")) and (length == (unique | length))) and
            (.live | type == "boolean"))
          and (map(.pr) | length == (unique | length))' <<<"$runs" >/dev/null \
          || { echo "run.json: every entry needs a numeric pr, a full 40-character sha, dir proof/<name> and a .js/.mjs/.cjs script (optional with live false, if the entry lists a test, check or offline lane), with no duplicate PRs. Optional: tests as relative *.test.* paths; checks as script names or [name, args...]; checkouts as {name, repo (openclaw/openclaw or CompleteDotTech/openclaw), full sha, build true/false} with unique names; stable as a version like 2026.11.10; offline as script file names; live as true or false."; exit 1; }
        while read -r dir script; do
          test -f "harness/$dir/scenario.json" && test -f "harness/$dir/$script" || { echo "Missing scenario.json or $script in $dir"; exit 1; }
        done < <(jq -r '.[] | select(.live) | "\(.dir) \(.script)"' <<<"$runs")
        while read -r dir lane; do
          test -f "harness/$dir/$lane" || { echo "Missing offline lane $lane in $dir"; exit 1; }
        done < <(jq -r '.[] | .dir as $d | .offline[] | "\($d) \(.)"' <<<"$runs")

        pick=$(grep -o '\[proof: *[a-z0-9, ]*\]' <<<"$HEAD_MESSAGE" | head -n1 | sed 's/^\[proof: *//; s/\]$//; s/ //g' || true)
        if [[ "$pick" == all ]] || [[ "$BEFORE" =~ ^0+$ ]]; then
          selected=$runs
        elif [[ -n "$pick" ]]; then
          selected=$(jq -c --arg pick "$pick" '($pick | split(",")) as $want | map(select(.pr as $p | $want | index($p)))' <<<"$runs")
        elif ! changed=$(gh api "repos/$GITHUB_REPOSITORY/compare/$BEFORE...$AFTER" --jq '[.files[].filename]'); then
          echo "Could not list the changed files, so every PR runs."
          selected=$runs
        elif jq -e 'any(.[]; . == "proof/make-clips.mjs" or . == ".github/workflows/scripted-audio-proof.yml")' <<<"$changed" >/dev/null; then
          selected=$runs
        else
          previous=$(gh api "repos/$GITHUB_REPOSITORY/contents/proof/run.json?ref=$BEFORE" -H "Accept: application/vnd.github.raw" 2>/dev/null | jq -c "$normalize" 2>/dev/null || echo '[]')
          selected=$(jq -c --argjson changed "$changed" --argjson previous "$previous" \
            'map(. as $r | select(($changed | any(startswith($r.dir + "/"))) or (($previous | index($r)) == null)))' <<<"$runs")
        fi
        echo "Proving: $(jq -r 'map("#" + .pr) | join(", ")' <<<"$selected")"
        { echo "matrix=$(jq -c . <<<"$selected")"; echo "count=$(jq length <<<"$selected")"; } >> "$GITHUB_OUTPUT"
  proof:
    name: 'Scripted audio proof #${{ matrix.pr }}'
    needs: plan
    if: needs.plan.outputs.count != '0'
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    concurrency:
      group: scripted-audio-proof-pr${{ matrix.pr }}
      cancel-in-progress: true
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.plan.outputs.matrix) }}
    env:
      CI: 'true'
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: 'true'
      PNPM_CONFIG_FROZEN_LOCKFILE: 'true'
      PR: ${{ matrix.pr }}
      SHA: ${{ matrix.sha }}
      DIR: ${{ matrix.dir }}
      SCRIPT: ${{ matrix.script }}
      TESTS: ${{ toJSON(matrix.tests) }}
      CHECKS: ${{ toJSON(matrix.checks) }}
      CHECKOUTS: ${{ toJSON(matrix.checkouts) }}
      STABLE: ${{ matrix.stable }}
      OFFLINE: ${{ toJSON(matrix.offline) }}
      LIVE: ${{ matrix.live }}
      PROOF_PR_DIR: ${{ github.workspace }}/pr
      PROOF_RESULTS_DIR: ${{ github.workspace }}/harness/${{ matrix.dir }}/results
    steps:
    - name: Check out the harness branch
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        path: harness
        persist-credentials: 'false'
    - name: Check out the exact PR head
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        repository: CompleteDotTech/openclaw
        ref: ${{ matrix.sha }}
        path: pr
        fetch-depth: '1'
        persist-credentials: 'false'
    - name: Verify and record the source under test
      run: |
        test "$(git -C pr rev-parse HEAD)" = "$SHA"
        jq -n --arg pr "$PR" --arg sha "$SHA" --arg tree "$(git -C pr rev-parse 'HEAD^{tree}')" \
          --arg harness "$(git -C harness rev-parse HEAD)" --arg run "$GITHUB_RUN_ID" \
          '{pr: $pr, head: $sha, tree: $tree, harness_commit: $harness, run_id: $run, checkouts: [], stable: null}' | tee "harness/$DIR/source.json"
        { echo "PROOF_CHECKOUTS={}"; echo "PROOF_STABLE_DIR="; } >> "$GITHUB_ENV"
    - name: Set up Node
      uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
      with:
        node-version: 24.22.1
    - name: Install and build the PR (no secrets)
      working-directory: pr
      run: |
        corepack enable pnpm
        npm install --global bun@1.4.4
        node --version; pnpm --version
        pnpm install --frozen-lockfile
        NODE_OPTIONS=--max-old-space-size=8192 pnpm build:ci-artifacts
        pnpm --dir ui exec playwright install --with-deps chromium
    - name: Check out, install and build the extra source trees (no secrets)
      if: join(matrix.checkouts.*.name, ' ') != ''
      run: |
        mapfile -t entries < <(jq -c '.[]' <<<"$CHECKOUTS")
        paths='{}'
        for entry in "${entries[@]}"; do
          name=$(jq -r .name <<<"$entry"); repo=$(jq -r .repo <<<"$entry")
          sha=$(jq -r .sha <<<"$entry"); build=$(jq -r .build <<<"$entry")
          dest="$GITHUB_WORKSPACE/checkouts/$name"
          echo "::group::$name: $repo@$sha"
          git init -q "$dest"
          git -C "$dest" fetch -q --depth 1 --no-tags "https://github.com/$repo.git" "$sha"
          git -C "$dest" -c advice.detachedHead=false checkout -q FETCH_HEAD
          test "$(git -C "$dest" rev-parse HEAD)" = "$sha"
          git -C pr fetch -q --depth 1 --no-tags "https://github.com/$repo.git" "$sha"
          (cd "$dest" && pnpm install --frozen-lockfile < /dev/null)
          if [[ "$build" == true ]]; then
            (cd "$dest" && NODE_OPTIONS=--max-old-space-size=8192 pnpm build:ci-artifacts < /dev/null)
          fi
          echo "::endgroup::"
          jq --arg name "$name" --arg repo "$repo" --arg sha "$sha" --arg tree "$(git -C "$dest" rev-parse 'HEAD^{tree}')" --argjson build "$build" \
            '.checkouts += [{name: $name, repo: $repo, sha: $sha, tree: $tree, built: $build}]' "harness/$DIR/source.json" > source.tmp
          mv source.tmp "harness/$DIR/source.json"
          paths=$(jq -c --arg name "$name" --arg path "$dest" '. + {($name): $path}' <<<"$paths")
        done
        echo "PROOF_CHECKOUTS=$paths" >> "$GITHUB_ENV"
    - name: Install the released openclaw (no secrets)
      if: matrix.stable != ''
      run: |
        dest="$GITHUB_WORKSPACE/stable"
        npm install --prefix "$dest" --no-audit --no-fund "openclaw@$STABLE"
        test "$(jq -r .version "$dest/node_modules/openclaw/package.json")" = "$STABLE"
        jq --arg version "$STABLE" --arg integrity "$(jq -r '.packages["node_modules/openclaw"].integrity // ""' "$dest/package-lock.json")" \
          '.stable = {package: "openclaw", version: $version, integrity: $integrity}' "harness/$DIR/source.json" > source.tmp
        mv source.tmp "harness/$DIR/source.json"
        echo "PROOF_STABLE_DIR=$dest" >> "$GITHUB_ENV"
    - name: Run the PR's listed tests (no secrets)
      id: tests
      if: join(matrix.tests, ' ') != ''
      continue-on-error: true
      working-directory: pr
      run: |
        mapfile -t tests < <(jq -r '.[]' <<<"$TESTS")
        pnpm test "${tests[@]}" --maxWorkers=1 2>&1 | tee "$GITHUB_WORKSPACE/harness/$DIR/tests.log"
    - name: Run the PR's listed checks (no secrets)
      id: checks
      if: join(matrix.checks, ' ') != ''
      continue-on-error: true
      working-directory: pr
      run: |
        mapfile -t entries < <(jq -c '.[]' <<<"$CHECKS")
        status=0
        for entry in "${entries[@]}"; do
          mapfile -t args < <(jq -r '.[]' <<<"$entry")
          echo "::group::pnpm run ${args[*]}"
          echo "== pnpm run ${args[*]}" >> "$GITHUB_WORKSPACE/harness/$DIR/checks.log"
          pnpm run "${args[@]}" < /dev/null 2>&1 | tee -a "$GITHUB_WORKSPACE/harness/$DIR/checks.log" || status=1
          echo "::endgroup::"
        done
        exit "$status"
    - name: Run the PR's offline lanes (no secrets)
      id: offline
      if: join(matrix.offline, ' ') != ''
      continue-on-error: true
      run: |
        mapfile -t lanes < <(jq -r '.[]' <<<"$OFFLINE")
        mkdir -p "$PROOF_RESULTS_DIR"
        status=0
        for lane in "${lanes[@]}"; do
          echo "::group::$lane"
          node "harness/$DIR/$lane" "$PROOF_PR_DIR" < /dev/null 2>&1 | tee "harness/$DIR/offline-${lane%.*}.log" || status=1
          echo "::endgroup::"
        done
        exit "$status"
    - name: Turn off swap before the secret is used
      run: |
        sudo swapoff -a
        test "$(wc -l < /proc/swaps)" -eq 1
    - name: Generate the scripted audio clips
      if: matrix.live && steps.tests.outcome != 'failure' && steps.checks.outcome != 'failure'
      env:
        OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
      run: |
        node harness/proof/make-clips.mjs "harness/$DIR/scenario.json"
        cat "harness/$DIR/clips/script.md" >> "$GITHUB_STEP_SUMMARY"
    - name: Run the browser proof
      if: matrix.live && steps.tests.outcome != 'failure' && steps.checks.outcome != 'failure'
      env:
        OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
      run: |
        ulimit -c 0
        node "harness/$DIR/$SCRIPT" "$PROOF_PR_DIR"
    - name: Summarize the cases
      if: always()
      env:
        TESTS_OUTCOME: ${{ steps.tests.outcome }}
        CHECKS_OUTCOME: ${{ steps.checks.outcome }}
        OFFLINE_OUTCOME: ${{ steps.offline.outcome }}
      run: |
        shopt -s nullglob
        {
          echo "## Case results for #$PR"
          if [[ -f "harness/$DIR/tests.log" ]]; then
            echo "- listed tests ($(jq -r 'join(", ")' <<<"$TESTS")): $TESTS_OUTCOME"
          fi
          if [[ -f "harness/$DIR/checks.log" ]]; then
            echo "- listed checks ($(jq -r 'map(join(" ")) | join(", ")' <<<"$CHECKS")): $CHECKS_OUTCOME"
          fi
          if [[ "$LIVE" != true ]]; then
            echo "- live proof not run for this entry (live: false)"
          elif [[ "$TESTS_OUTCOME" == failure || "$CHECKS_OUTCOME" == failure ]]; then
            echo "- live proof skipped because a listed test or check failed"
          fi
          if [[ "$OFFLINE_OUTCOME" == success || "$OFFLINE_OUTCOME" == failure ]]; then
            echo "- offline lanes ($(jq -r 'join(", ")' <<<"$OFFLINE")): $OFFLINE_OUTCOME"
          fi
          for f in harness/"$DIR"/results/run-*/*/case.json; do
            echo "- $(basename "$(dirname "$f")"): $(jq -r '.status + (if .detail then " (" + .detail + ")" else "" end)' "$f")"
          done
          echo
          echo "Result files:"
          echo '```'
          if [[ -d "harness/$DIR/results" ]]; then (cd "harness/$DIR" && find results -type f | sort | sed -n '1,80p'); else echo "(no result files)"; fi
          echo '```'
        } >> "$GITHUB_STEP_SUMMARY"
    - name: Upload the proof bundle
      if: always()
      uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
      with:
        name: scripted-audio-proof-pr${{ matrix.pr }}-${{ github.run_id }}
        path: |
          harness/${{ matrix.dir }}/source.json
          harness/${{ matrix.dir }}/clips/
          harness/${{ matrix.dir }}/results/
          harness/${{ matrix.dir }}/tests.log
          harness/${{ matrix.dir }}/checks.log
          harness/${{ matrix.dir }}/offline-*.log
        retention-days: 30
        if-no-files-found: warn
    - name: Fail the job if a listed test, check or offline lane failed
      if: steps.tests.outcome == 'failure' || steps.checks.outcome == 'failure' || steps.offline.outcome == 'failure'
      run: |
        echo "A listed test, check or offline lane failed; see tests.log, checks.log and offline-*.log in the proof bundle."
        exit 1
